        //based on std::expected, but this could've also been rust's Result if i was in my rust era again
        /** @template [T=object, K=object] */
        class Expected {
            /** @type {T?} */
            value;
            /** @type {K?} */
            error;
            /**
             * @param {T?} value
             * @param {K?} error
             */
            constructor(value, error = undefined) {
                this.value = value;
                this.error = error;
            }
            has_value() {
                return this.value != undefined;
            }
        }

        function Unexpected(error) {
            return new Expected(undefined, error);
        }

        class ParseError extends Error {
            line;
            char;

                //    errorMessage += " ";

            }

        class JavascriptLexer extends Lexer {

                //strict mode
                // ["let", true],

                // ["implements", true],

                // ["package", true],
                // ["private", true],
                // ["protected", true],
                // ["public", true]

                //regular
                ["let", true],
                ["static", true],
                ["yield", true],

                ["implements", true],
                ["interface", true],
                ["package", true],
                ["private", true],
                ["protected", true],
                ["public", true]

            /** @param {JavascriptInterpreter} parentInterpreter */
            constructor(parentInterpreter) {
                super(parentInterpreter);
            }

            /** 
             * @param {String} str
             * @returns {Expected<Array<Token>, ParseError>} */
            lex(str, readingTemplate = false) {
                debugger;

                /** @type {Array<Token>} */
                const tokens = [];

                //let i = 0;
                let lineNumber = 1;
                let lineIndex = 0;

                let useStrict = [false];

                let depth = {
                    parenthesis: 0,
                    bracket: 0,
                    curly: +readingTemplate,
                    inStrictFunctionOrClassBracketEndingDepth: [{kind: undefined, curly: -1, strict: undefined}], // when we reach a closing bracket we'll check this number to disable strict mode if needed
                };

                if(str.length > 1) {
                    if(str[0] == '#' && str[1] == '!') {
                        str = str.replace("#!", "//"); //lol
                    }
                }

                const isNumberRegex = /[0-9]/;
                const identifierStartRegex = /[$_\p{ID_Start}]/u;
                const identifierRegex = /[$\p{ID_Continue}]/u;

                const hexRegex = /[0-9a-f_]/i;
                const octalRegex = /[0-7_]/;

                // let startOfFunctionBlockTokenLength = [{length: -1, ref: undefined}];
                let startOfFunctionBlockTokenLength = [0]; // this variable will be set to the length of tokens after the open curly bracket, if a "use strict" string is found, and (tokens.length - startOfFunctionBlock) == 0, this was the first thing in the function (blocks cannot be strict apparently)

                templateStopLexing:
                while(this.i < str.length) {
                    const char = str[this.i++];
                    const charNumber = this.i - lineIndex;
                    switch(char) {
                        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#white_space
                        case '\t':
                        case '\v':
                        case '\f':
                        case ' ':
                        case '\r': //probably fine
                        case '\u00A0': //nbsp
                        case '\uFEFF': //bom marker
                        //<USP>...
                            continue;

                        case '/':
                            if(str[this.i] == '/') {
                                //comment
                                this.i = str.indexOf("\n", this.i);
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '*') {
                                //multiline comment

                                while((this.i = str.indexOf("\n", this.i)+1) < target) { //uhh probably right
                                    lineNumber++;
                                    lineIndex = this.i;
                                }
                                this.i = target;
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '=') {
                                //consume =
                                this.i++;
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.DIV_EQUALS, "/="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.SLASH, "/"));
                            }
                            break;

                        case '\n': //automagic semicolon insertion...
                            lineNumber++;
                            lineIndex = this.i;
                            break;

                        case '"':
                        case '\'':
                        case '`': {
                            const stringToken = new Token(lineNumber, charNumber, TokenKind.STRING, "");
                            let escaped = false;
                            let ended = false;
                            while(this.i < str.length) {
                                if(str[this.i] == char) {
                                    this.i++; //consume ending quote
                                    ended = true;
                                    break;
                                }
                                if(str[this.i] == '\n') {
                                    lineNumber++;
                                    lineIndex = this.i;
                                    this.i++; //consume newline
                                    if(!escaped) {
                                        if(char == '`') {
                                            //backtick allows multiline string
                                            stringToken.value += "\n";
                                        }else {
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "Use a backslash for multiline strings! (or use the backtick quote '`')"));
                                        }
                                    }else {
                                        escaped = false;
                                    }
                                }else if(str[this.i] == '\\') {
                                    //escape!
                                    this.i++; //consume \

                                            //useStrict.at(-1)
                                            break;

                                        case '2':
                                        case '3':
                                        case '4':
                                        case '5':
                                        case '6':
                                        case '7':
                                        case '8':
                                        case '9':
                                        case 'x':
                                        case 'u':
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "We're not doing all that fancy escape stuff bruh"));
                                            break;
                                        case '\'':
                                            stringToken.value += '\'';
                                            break;
                                        case '"':
                                            stringToken.value += '\"';
                                            break;
                                        case '\\':
                                            stringToken.value += '\\';
                                            break;
                                        case 'n':
                                            stringToken.value += '\n';
                                            break;
                                        case 'r':
                                            stringToken.value += '\r';
                                            break;
                                        case 'v':
                                            stringToken.value += '\v';
                                            break;
                                        case 't':
                                            stringToken.value += '\t';
                                            break;
                                        case 'b':
                                            stringToken.value += '\b';
                                            break;
                                        case 'f':
                                            stringToken.value += '\f';
                                            break;

                                                this.i++; //consume \r

                                            }
                                        case '\n':

                                            break;

                                            break;
                                    }
                                    this.i++; //consume whatever character that was
                                }else if(char == '`' && str[this.i] == '$') {
                                    if(str[this.i+1] == '{') {
                                        const templateCharNumber = this.i+1 - lineIndex;
                                        this.i+=2; //consume dollar and curly bracket
                                        //template
                                        return Unexpected(new ParseError(lineNumber, templateCharNumber, "Template string substitution not implemented (correctly) yet!"))
                                        const result = this.lex(str, true); // who knew making the lexer its own object would come in handy (i'm actually talking about using this.i)
                                        if(!result.has_value()) {

                                        }
                                        tokens.push(new Token(lineNumber, templateCharNumber, TokenKind.TEMPLATE_EXPRESSION, result.value));
                                    }else {

                                    }
                                }else {

                                }
                            }
                            if(!ended) {
                                return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "End of file reached before ending string quote!"));
                            }
                            //if(stringToken.value == "use strict") { //lol
                            //    if(tokens.length == 0) {
                            //        useStrict[0] = true;
                            //    }
                            //}
                            if(tokens.length - startOfFunctionBlockTokenLength.at(-1) == 0) {
                                //process statement in directive prologue...

                                //there can be multiple string expression statements that make up the directive prologue so we need to keep looking...
                                startOfFunctionBlockTokenLength[startOfFunctionBlockTokenLength.length-1]+=2; // += 2 for string + semicolon
                                if(stringToken.value == "use strict") {
                                    //startOfFunctionBlockTokenLength.at(-1).ref.strict = true;
                                    if(startOfFunctionBlockTokenLength.length == 1) { //global
                                        useStrict[0] = true;
                                    }else {
                                        depth.inStrictFunctionOrClassBracketEndingDepth.at(-1).strict = true; // i think we can assume this
                                        useStrict.push(true);
                                    }

                            tokens.push(stringToken);
                            break;
                        }

                        case '?':
                            if(str[this.i] == '.') {
                                this.i++; //consume dot
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.OPTIONAL_CHAINING, "?."));
                            }else if(str[this.i] == '?') {
                                this.i++; //consume ?
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.NULLISH_COALESCING_EQUALS, "??="));
                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.NULLISH_COALESCING, "??"));

                                // ok wait cancel strict mode here because this is an object literal property (my lexer enables strict mode the moment 'class' is encountered)
                                useStrict.pop();
                                depth.inStrictFunctionOrClassBracketEndingDepth.pop();
                            }
                            tokens.push(new Token(lineNumber, charNumber, TokenKind.COLON, ":"));
                            break;

                        case ';':
                            if(tokens.length && tokens.at(-1).value == "class") {
                                // ok wait cancel strict mode here because this is a class field (my lexer enables strict mode the moment 'class' is encountered)
                                useStrict.pop();
                                depth.inStrictFunctionOrClassBracketEndingDepth.pop();
                            }
                            tokens.push(new Token(lineNumber, charNumber, TokenKind.SEMICOLON, ";"));
                            break;

                        case '+':
                            if(str[this.i] == '+') {
                                this.i++; //consume +
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.INCREMENT, "++"));
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.PLUS_EQUALS, "+="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.PLUS, "+"));
                            }
                            break;

                        case '-':
                            if(str[this.i] == '-') {
                                this.i++; //consume -

                                    //comment
                                    //--> closing single html comment for some reason
                                    //https://tc39.es/ecma262/multipage/additional-ecmascript-features-for-web-browsers.html#sec-html-like-comments

                                    this.i = str.indexOf("\n", this.i);

                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.DECREMENT, "--"));
                                }
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MINUS_EQUALS, "-="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MINUS, "-"));
                            }
                            break;

                            if(str[this.i] == '*') {
                                this.i++; //consume *
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.EXPONENTIATION_EQUALS, "**="));

                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_SHIFT_LEFT_EQUALS, "<<="));

                                }
                            }else if(str[this.i] == '!') {

                                        this.i = str.indexOf("\n", this.i);

                                        tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT_EQUALS, ">>>="));

                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.LOGICAL_AND, "&&"));
                                }
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_AND_EQUALS, "&="));

                                this.i++; //consume =

        function isValidLeftHandAssignment(strict, expression, depth = 0) {
            if(expression instanceof BinaryExpression) {
                if(expression.operatorToken.kind != TokenKind.COMMA) {
                    let valid = isValidLeftHandAssignment(strict, expression.left, depth+1);
                    if(!valid) {

                    case TokenKind.DOT:

                    case TokenKind.OPEN_BRACKET:

                        break;

            }else if(expression instanceof FunctionCallExpression && depth != 0) { // a function expression is not assignable! if we just entered this function (depth == 0), don't allow this!
                return isValidLeftHandAssignment(strict, expression.functionExpr, depth+1);
            }else if(expression instanceof IdentifierExpression) {

                    return true;
                }
                if(strict && (expression.nameToken.value == "arguments" || expression.nameToken.value == "eval")) {
                    //we'll just throw the error here since i can't change the error message for every time i call isValidwhateverthefuckthisfunctioniscalled

                    throw new ParseError(expression.nameToken.line, expression.nameToken.char, "Unexpected eval or arguments in strict mode");
                }
                return expression.nameToken.value != "this"; //this is not assignable!
            }else if(expression instanceof SuperPropertyExpression) {

                return false;
            }
            return depth != 0; //return false if depth == 0

        /** @param {Expression} expression */
        function containsArguments(expression) {

            //i've accidently written this.containsArguments for every invocation
            //thank god we're not in strict mode and globalThis does, indeed, have the containsArguments property
            if(expression instanceof BinaryExpression || expression instanceof AssignmentExpression) {
                if(expression.operatorToken.kind == TokenKind.DOT) {
                    return this.containsArguments(expression.left);
                }
                return this.containsArguments(expression.left) ||  this.containsArguments(expression.right);
            }else if(expression instanceof UnaryExpression) {
                return this.containsArguments(expression.operand);
            }else if(expression instanceof ArrayLiteralExpression) {
                for(const value of expression.value) {
                    if(this.containsArguments(value)) {

                    }
                }
            }else if(expression instanceof ObjectLiteralExpression) {
                for(const [key, value] of expression.properties.entries()) {
                    //key could be SpreadExpression...
                    if((key instanceof Token && key.value == "arguments") || this.containsArguments(key) || this.containsArguments(value)) {

            }else if(expression instanceof SpreadExpressionToBeEvaluatedManuallyBecauseContextIsImportant) {
                return this.containsArguments(expression.rhs);
            }else if(expression instanceof TernaryExpression) {
                return this.containsArguments(expression.condition) || this.containsArguments(expression.trueExpr) || this.containsArguments(expression.falseExpr);
            }else if(expression instanceof FunctionCallExpression) {
                if(this.containsArguments(expression.functionExpr)) {
                    return true;
                }
                for(const arg of expression.argumentsExprArr) {
                    if(this.containsArguments(arg)) {
                        return true;
                    }
                }
            }else if(expression instanceof VariableDeclarationStatement) {
                return this.containsArguments(expression.value);
            }else if(expression instanceof BlockStatement) {
                for(const statement of expression.statements) {
                    if(this.containsArguments(statement)) {
                        return true;
                    }
                }
            }else if(expression instanceof IfStatement) {
                return this.containsArguments(expression.condition) || this.containsArguments(expression.ifClause) || this.containsArguments(expression.elseClause);
            }else if(expression instanceof WhileStatement) {
                return this.containsArguments(expression.condition) || this.containsArguments(expression.body);
            }else if(expression instanceof ForLoopStatement) {
                return this.containsArguments(expression.initialization) || this.containsArguments(expression.condition) || this.containsArguments(expression.afterthought) || this.containsArguments(expression.body);
            }else if(expression instanceof ReturnStatement) {
                //this won't happen in a class static block (because return isn't allowed there)
                return this.containsArguments(expression.expr);
            }else if(expression instanceof ArrayComprehensionExpression) {
                return expression.containsArguments();
            }else if(expression instanceof IdentifierExpression) {
                return expression.nameToken.value == "arguments";
            }

            return false;
        }

                        }
                    }
                }
                return true;

            pushHoistedDeclarations() {
                // const statements = this.inFunction.at(-1) || this.statements;
                const scope = this.scope[this.scope.length-1]; //not using .at because for some reason vscode acts like it doesn't know the types anymore
                const statements = scope.blockStatementArray;
                /** @type {Array<StaticAnalysisFunctionVariable>} */
                const tempFunctions = [];
                let j = 0;
                for(const $var of scope.hoisted) {
                    if($var.qualifier.value == "var") {
                        //splicing at i so they're in order even though that's probably not important
                        statements.splice(j, 0, new VariableDeclarationStatement($var.gender, $var.qualifier, $var.name.value, undefined));
                        j++;
                    }else if($var.qualifier.value == "function") {
                        //with my new implementation, do function need the temporal dead zone? (or did they ever?)
                        tempFunctions.push($var);
                    }else {
                        //temporal dead zone...
                        statements.splice(j, 0, new TemporalDeadZoneDeclarationStatement($var.gender, $var.qualifier, $var.name.value, undefined));
                        j++;
                    }
                }
                for(const $var of tempFunctions) {
                    //we put actual functions after all declarations so that the functions can reference each other as well as all local variables
                    statements.splice(j, 0, $var.statement);
                    j++;
                }

                // this.hoistedVars = [];
            }

            directivePrologue() {
                const old = this.i;
                while(this.tokens.length && this.peek(TokenKind.STRING)) {
                    const string = this.tokens[this.i++];
                    if(!this.match(TokenKind.SEMICOLON)) {
                        break;
                    }
                    if(string.value == "use strict") {
                        this.useStrict = true;
                    }
                    // this.consume(TokenKind.SEMICOLON, "Expected semicolon to separate string expression statements in directive prologue");
                }
                this.i = old; //reset lol
            }

            /**
             * @param {Array<Token>} tokens
             * @returns {Expected<Array<Statement>, ParseError>} */
            parse() /*override*/ {
                //if(this.tokens.length && this.tokens[0].kind == TokenKind.STRING && this.tokens[0].value == "use strict") {
                //    this.useStrict = true;
                //}

                this.directivePrologue();

                //i'm being lazy as FUCK here because i just remembered the lexer and parser have access to the interpreter
                // this.interpreter.state.strict = this.useStrict;
                this.interpreter.executionContext.lexicalEnvironment.SetStrict(this.useStrict);

                ///** @type {Array<Statement>} */
                //const statements = [];
                try {
                    while(this.i < this.tokens.length) {
                        const statement = this.declaration();
                        if(statement instanceof FunctionStatement) {
                            //we hoist function statements to the top of the scope
                            //this.statements.splice(0, 0, statement);

                            //actually we'll do this with the rest of the hoisted vars
                        }else {
                            this.statements.push(statement);
                        }
                    }
                }catch(e) {
                    //when i was using std expected i never thought to throw instead of propagating the expected out
                    if(!(e instanceof ParseError)) {
                        throw e; //lmao
                    }
                    return Unexpected(e);
                }

                //this.pushHoistedDeclarations(this.statements);
                this.pushHoistedDeclarations();

                return new Expected(this.statements);
            }
        }

        class DeclarativeEnvironmentRecord extends EnvironmentRecord {

                this.bindings.set(name, new MutableBinding(deletable));
                return undefined; //UNUSED
            }

            CreateImmutableBinding(name, strict) /*override*/ {

                return undefined; //UNUSED
            }

                binding.value = value;

                        //variable = 2;
                        throw new ReferenceError(`${name} is not defined`); //is this the right error message?
                    }
                    this.CreateMutableBinding(name, true);
                    this.InitializeBinding(name, value);

                if(binding.strict) strict = true;
                if(!binding.initialized) {

                    //let x = 2;
                    throw new ReferenceError(`Cannot access '${name}' before initialization`);

                    throw new ReferenceError(`Cannot access '${name}' before initialization`);

                return binding.value;

                            this.executionContext.privateEnvironment = outerPrivateEnv;
                            throw abruptCompletion; //rethrow i guess
                        }
                        if(element instanceof PrivateElement) {
                            //Assert: element["[[Kind]]"] == PrivateElementKind.METHOD || element["[[Kind]]"] == PrivateElementKind.ACCESSOR
                            //!IsStatic(classElement)
                            let container;
                            if(!key.static) {
                                container = instancePrivateMethods;
                            }else {
                                container = staticPrivateMethods;
                            }
                            const existingElementIndex = container.findIndex(existingElement=>existingElement instanceof PrivateElement && existingElement["[[Key]]"] == element["[[Key]]"]);
                            if(existingElementIndex != -1) {
                                //Assert: element["[[Kind]]"] == PrivateElementKind.ACCESSOR && existingElement["[[Kind]]"] == PrivateElementKind.ACCESSOR;
                                const existingElement = container[existingElementIndex];
                                let combined;
                                if(element["[[Getter]]"] == undefined) {
                                    combined = new PrivateElement(element["[[Key]]"], PrivateElementKind.ACCESSOR, undefined, existingElement["[[Getter]]"], element["[[Setter]]"]);
                                }else {
                                    combined = new PrivateElement(element["[[Key]]"], PrivateElementKind.ACCESSOR, undefined, element["[[Getter]]"], existingElement["[[Setter]]"]);
                                }
                                container[existingElementIndex] = combined;
                            }else {
                                container.push(element);
                            }
                        }else if(element instanceof ClassFieldDefinitionRecord) {
                            //!IsStatic(classElement)
                            if(!key.static) {
                                instanceFields.push(element);
                            }else {
                                staticElements.push(element);
                            }
                        }else if(element instanceof ClassStaticBlockDefinitionRecord) {
                            staticElements.push(element);
                        }else {
                            //Assert: element == undefined
                        }
                    }
                }
                this.executionContext.lexicalEnvironment = envRecord; //pop lexicalEnvironment
                if(classStatement.classBinding) {
                    classEnv.InitializeBinding(classStatement.classBinding, ctorFunc);
                }
                ctorFunc["[[PrivateMethods]]"] = instancePrivateMethods;
                ctorFunc["[[Fields]]"] = instanceFields;
                for(const method of staticPrivateMethods) {
                    /*!*/ ECMAScript.PrivateMethodOrAccessorAdd(ctorFunc, method);
                }
                for(const elementRecord of staticElements) {
                    let result;
                    try {
                        if(elementRecord instanceof ClassFieldDefinitionRecord) {
                            //result = Completion(DefineField(ctorFunc, elementRecord));
                            //DefineField(ctorFunc, elementRecord);
                            //const fieldName = elementRecord["[[Name]]"];
                            //const initializer = elementRecord["[[Initializer]]"];
                            //let initValue;
                            //if(initializer !== undefined) {
                            //    initValue = ECMAScript.Call(initializer, ctorFunc);
                            //}else {
                            //    initValue = undefined;
                            //}
                            //if(fieldName instanceof PrivateName) {
                            //    //Perform ? PrivateFieldAdd(ctorFunc, fieldName, initValue);
//
                            //}else {
                            //    //Assert: typeof fieldName == "string" || fieldName == "symbol"
                            //    /*?*/ ECMAScript.CreateDataPropertyOrThrow(ctorFunc, fieldName, initValue);
                            //}
                            //return undefined; //UNUSED

                            //bruh i just reinvented the wheel here because i forgot i'd already written this entire function earlier
                            result = ECMAScript.DefineField(ctorFunc, elementRecord);
                        }else {
                            //Assert: elementRecord instanceof ClassStaticBlockDefinitionRecord
                            result = ECMAScript.Call(elementRecord["[[BodyFunction]]"], ctorFunc); //ah yes, ctorFunc as the thisArg
                        }
                    }catch(abruptCompletion) {
                        this.executionContext.privateEnvironment = outerPrivateEnv; //pop privateEnvironment
                        throw abruptCompletion; //rethrow i guess
                    }
                }
                this.executionContext.privateEnvironment = outerPrivateEnv; //pop privateEnvironment
                
                //BindingClassDeclarationEvaluation 15.7.15
                if(classStatement.classBinding) {
                    //InitializeBoundName
                    this.executionContext.lexicalEnvironment.InitializeBinding(classStatement.classBinding, ctorFunc);
                }
                
                return ctorFunc;
            }
        }

        class Printer {
            spaces;
            constructor() {
                this.spaces = 0;
            }

            print(statement) {
                console.log(statement.accept(this));
            }

            /** @param {BlockStatement} blockStatement */
            visitBlockStatement(blockStatement) {
                if(blockStatement.statements.length == 0) return "{}";
                let block = "{\n";
                this.spaces += 4;
                for(const statement of blockStatement.statements) {
                    block += "".padStart(this.spaces) + statement.accept(this) + "\n";
                }
                this.spaces -= 4;
                return block + "".padStart(this.spaces) + "}\n";
            }

            /** @param {IfStatement} ifStatement */
            visitIfStatement(ifStatement) {
                return `if ( ${ifStatement.condition.accept(this)} ) ${ifStatement.ifClause.accept(this)}${ifStatement.elseClause ? "else " + ifStatement.elseClause.accept(this) : ""}`;
            }

            /** @param {WhileStatement} whileStatement */
            visitWhileStatement(whileStatement) {
                return `while ( ${whileStatement.condition.accept(this)} ) ${whileStatement.body.accept(this)}`;
            }

            /** @param {ExpressionStatement} expressionStatement */
            visitExpressionStatement(expressionStatement) {
                return expressionStatement.expression.accept(this) + ";";
            }

            /** @param {IdentifierExpression} identifierExpression */
            visitIdentifierExpression(identifierExpression) {
                return identifierExpression.nameToken.value;
            }

            /** @param {PrivateIdentifierExpression} privateIdentifierExpression */
            visitPrivateIdentifierExpression(privateIdentifierExpression) {
                return privateIdentifierExpression.nameToken.value;
            }

            /** @param {UnaryExpression} unaryExpression */
            visitUnaryExpression(unaryExpression) {
                if(unaryExpression.postfix) {
                    return `(${unaryExpression.operand.accept(this)} ${unaryExpression.operatorToken.value})`;
                }else {
                    return `(${unaryExpression.operatorToken.value} ${unaryExpression.operand.accept(this)})`;
                }
            }
            
            /** @param {BinaryExpression} binaryExpression */
            visitBinaryExpression(binaryExpression) {
                return `(${binaryExpression.left.accept(this)} ${binaryExpression.operatorToken.value} ${binaryExpression.right.accept(this)}${binaryExpression.operatorToken.value == '[' ? " ]" : ""})`;
            }

            /** @param {TernaryExpression} ternaryExpression */
            visitTernaryExpression(ternaryExpression) {
                return `(${ternaryExpression.condition.accept(this)} ? ${ternaryExpression.trueExpr.accept(this)} : ${ternaryExpression.falseExpr.accept(this)})`;
            }

            /** @param {FunctionCallExpression} funcCallExpression */
            visitFunctionCallExpression(funcCallExpression) {
                return `${funcCallExpression.functionExpr.accept(this)}(${funcCallExpression.argumentsExprArr.map(v=>{
                    if(v instanceof SpreadExpressionToBeEvaluatedManuallyBecauseContextIsImportant) {
                        return `...${v.rhs.accept(this)}`;
                    }else {
                        return v.accept(this);
                    }
                })})`;
            }

            /** @param {ArrayComprehensionExpression} arrayComprehensionExpression */
            visitArrayComprehensionExpression(arrayComprehensionExpression) {
                return `[${arrayComprehensionExpression.topMostStatementTree.accept(this)}]`; //that boy should unravel himself!
            }

            /** @param {LiteralExpression} literalExpression */
            visitLiteralExpression(literalExpression) {
                switch(typeof literalExpression.value) { //the dot has higher precedence
                    case "bigint":
                        return literalExpression.value+"n";
                        break;
                    case "string":
                        return `'${literalExpression.value}'`;
                        break;
                    case "object":
                        try {
                            return JSON.stringify(literalExpression.value); // apparently, passing window will cause JSON.stringify to throw an error! (of course, it would've been too much text if it worked anyways lol)
                            break;
                        }catch(e) {
                            console.warn(e);
                            //[[fallthrough]]
                        }
                    case "symbol":
                        return literalExpression.value.toString();
                        break;
                    default:
                        //ouhh the coercion here doesn't work for symbols...
                        //we still need it for null and undefined though
                        return literalExpression.value+"";
                        break;
                }
            }

            visitEmptyStatement() {
                return ';';
            }

            /** @param {VariableDeclarationStatement} varDeclStatement */
            visitVariableDeclarationStatement(varDeclStatement) {
                let optionalshit = "";
                if(varDeclStatement.gender) {
                    optionalshit += varDeclStatement.gender.value + " ";
                }
                if(varDeclStatement.qualifier) {
                    optionalshit += varDeclStatement.qualifier.value + " ";
                }
                return optionalshit + varDeclStatement.name + (varDeclStatement.value != undefined ? " = " + varDeclStatement.value.accept(this) : "") + ";"; //don't worry lol ternary operator has lower precedence!
            }

            /** @param {TemporalDeadZoneDeclarationStatement} temporalDeclStatement */
            visitTemporalDeclarationStatement(temporalDeclStatement) {
                return `// (TDZ) ${temporalDeclStatement.qualifier.value} ${temporalDeclStatement.name};`; // <- temporal dead zone starts here
            }

            /** @param {ForOfStatement} statement */
            handleForStatementLazilyLol(statement, kind) {
                let result = `for${kind == "await" ? " "+kind : ""} (`;
                if(statement.tdzStatements.length) {
                    result += "\n";
                    for(const tdz of statement.tdzStatements) {
                        result += tdz.accept(this) + "\n";
                    }
                }
                switch(kind) {
                    case "loop":
                        result += statement.initialization.accept(this);
                        result += statement.condition.accept(this);
                        result += statement.afterthought.accept(this);
                        break;
                    case "await":
                    case "of":
                        result += statement.identifierDeclaration.accept(this);
                        result += " of ";
                        result += statement.iterableExpr.accept(this);
                        break;
                    case "in":
                        result += statement.identifierDeclaration.accept(this);
                        result += " in ";
                        result += statement.iterableExpr.accept(this);
                        break;
                }
                if(result[result.length-1] == ';') {
                    result = result.substring(0, result.length-1);
                }
                return result + ")" + statement.body.accept(this);
            }

            /** @param {ForLoopStatement} forLoopStatement */
            visitForLoopStatement(forLoopStatement) {
                return this.handleForStatementLazilyLol(forLoopStatement, "loop");
            }

            /** @param {ForOfStatement} forOfStatement */
            visitForOfStatement(forOfStatement) {
                return this.handleForStatementLazilyLol(forOfStatement, "of");
            }

            /** @param {ForInStatement} forInStatement */
            visitForInStatement(forInStatement) {
                return this.handleForStatementLazilyLol(forInStatement, "in");
            }

            /** @param {ForAwaitOfStatement} forAwaitOfStatement */
            visitForAwaitOfStatement(forAwaitOfStatement) {
                return this.handleForStatementLazilyLol(forAwaitOfStatement, "await");
            }

            parameters(parameters) {
                let result = "(";
                for(let i = 0; i < parameters.length; i++) {
                    const {identifier, default: $default, rest} = parameters[i];
                    if(rest) {
                        result += "...";
                    }
                    result += identifier.nameToken.value;
                    if($default) {
                        result += " = " + $default.accept(this);
                    }
                    if(i != parameters.length-1) {
                        result += ", ";
                    }
                }
                return result + ")";
            }

            /** @param {FunctionStatement} functionStatement */
            visitFunctionStatement(functionStatement) {
                switch(functionStatement.kindSoThatICanDoThisStuffCorrectly) {
                    case FunctionKind.ARROW:
                        return `${this.parameters(functionStatement.parameters)}=>${functionStatement.body.accept(this)}`;
                        break;
                    //never mind methods are handled by visitObjectLiteralExpression directly (this will probably change though)
                    //damn i don't even need this switch statement anymore!
                    //case FunctionKind.METHOD:
                    //case FunctionKind.GETTER:
                    //case FunctionKind.SETTER: {
                    //    let prefix = "";
                    //    if(functionStatement.kindSoThatICanDoThisStuffCorrectly == FunctionKind.GETTER) {
                    //        prefix = "get ";
                    //    }else if(functionStatement.kindSoThatICanDoThisStuffCorrectly == FunctionKind.SETTER) {
                    //        prefix = "set ";
                    //    }
                    //    let space = functionStatement.isAsync || functionStatement.isGenerator || prefix;
                    //    return `${functionStatement.isAsync ? "async" : ""}${functionStatement.isGenerator ? "*" : ""}${space ? " " : ""}${prefix}${functionStatement.nameToken.value}${this.parameters(functionStatement.parameters)} ${functionStatement.body.accept(this)}`;
                    //    break;
                    //}
                    default:
                        return `${functionStatement.genderToken ? functionStatement.genderToken.value+" " : ""}${functionStatement.isAsync ? "async " : ""}function${functionStatement.isGenerator ? "*" : ""}${functionStatement.nameToken.value ? " "+functionStatement.nameToken.value : ""}${this.parameters(functionStatement.parameters)} ${functionStatement.body.accept(this)}`;
                        break;
                }
            }

            /** @param {ReturnStatement} returnStatement */
            visitReturnStatement(returnStatement) {
                return `return ${returnStatement.expr.accept(this)};`;
            }

            /** @param {DebuggerStatement} debuggerStatement */
            visitDebuggerStatement(debuggerStatement) {
                return `debugger;`;
            }

            /** @param {ArrayLiteralExpression} arrayLiteralExpression */
            visitArrayLiteralExpression(arrayLiteralExpression) {
                //return `[${arrayLiteralExpression.value.reduce(v=>{
                //    if(v instanceof SpreadExpressionToBeEvaluatedManuallyBecauseContextIsImportant) {
                //        return `...${v.rhs.accept(this)}`;
                //    }else {
                //        return v.accept(this);
                //    }
                //})}]`;
                //return `[${arrayLiteralExpression.value.reduce((acc, v)=>{
                //    if(v instanceof SpreadExpressionToBeEvaluatedManuallyBecauseContextIsImportant) {
                //        return acc + `...${v.rhs.accept(this)}`;
                //    }else {
                //        return acc + v.accept(this);
                //    }
                //}, "")}]`;
                let result = "[";
                for(let i = 0; i < arrayLiteralExpression.value.length; i++) {
                    if(i in arrayLiteralExpression.value) {
                        const v = arrayLiteralExpression.value[i];
                        if(v instanceof SpreadExpressionToBeEvaluatedManuallyBecauseContextIsImportant) {
                            result += `...${v.rhs.accept(this)}`;
                        }else {
                            result += v.accept(this);
                        }
                    }else if(i+1 == arrayLiteralExpression.value.length) {
                        result += ",";
                    }
                    if(i+1 < arrayLiteralExpression.value.length) {
                        result += ",";
                    }
                }
                return result + "]";
            }

            /** @param {ObjectLiteralExpression} objectLiteralExpression */
            visitObjectLiteralExpression(objectLiteralExpression) {
                if(objectLiteralExpression.properties.size == 0) return "{}";
                let result = "{\n";
                const entries = objectLiteralExpression.properties.entries();
                this.spaces += 4;
                let i = 0;
                for(const [key, value] of entries) {
                    if(i > 0) {
                        result += ",\n";
                    }
                    result += "".padStart(this.spaces);
                    if(key instanceof Token) {
                        result += key.value;
                    }else if(key instanceof SpreadExpressionToBeEvaluatedManuallyBecauseContextIsImportant) {
                        result += `...${key.rhs.accept(this)}`;
                    //}else if((key instanceof IdentifierExpression || (key instanceof LiteralExpression && (typeof key.value == "number" || typeof key.value == "string"))) && !key.computed) {
                    }else {
                        let bl = "";
                        let br = "";
                        if(key.computed) {
                            bl = "[";
                            br = "]";
                        }
                        if(key.method) {
                            let prefix = "";
                            if(value.kindSoThatICanDoThisStuffCorrectly == FunctionKind.GETTER) {
                                prefix = "get ";
                            }
                            if(value.kindSoThatICanDoThisStuffCorrectly == FunctionKind.SETTER) {
                                prefix = "set ";
                            }
                            const space = !!(value.isAsync || value.isGenerator);
                            result += `${value.isAsync ? "async" : ""}${value.isGenerator ? "*" : ""}${space ? " " : ""}${prefix}${bl}${key.accept(this)}${br}${this.parameters(value.parameters)} ${value.body.accept(this)}`;
                            if(result[result.length-1] == "\n") { //non empty block statements add a newline after the closing curly bracket but we don't want that here!
                                result = result.substring(0, result.length-1);
                            }
                        }else {
                            result += `${bl}${key.accept(this)}${br}: ${value.accept(this)}`;
                        }
                        /*if(key.computed) {
                            if(key.method) {
                                
                            }else {
                                result += `[${key.accept(this)}]: ${value.accept(this)}`;
                            }
                        }else {
                            result += `${key.accept(this)}: ${value.accept(this)}`; //omit the brackets (even though it's still valid javascript)
                        }*/
                    }
                    i++;
                }
                this.spaces -= 4;
                return result + "\n}";
            }

            /** @param {ClassStatement} classStatement */
            visitClassStatement(classStatement) {
                //throw error;
                // return `${classStatement.genderToken ? classStatement.genderToken.value+" " : ""}class${classStatement.classBinding ? " "+classStatement.classBinding : ""}${classStatement.classHeritage ? ` extends (${classStatement.classHeritage.accept(this)})` : ""} {...}`;
                let result = `${classStatement.genderToken ? classStatement.genderToken.value+" " : ""}class${classStatement.classBinding ? " "+classStatement.classBinding : ""}${classStatement.classHeritage ? ` extends (${classStatement.classHeritage.accept(this)})` : ""} {`;
                if(classStatement.properties.size == 0 && !classStatement.$constructor) return result + "}";
                result += "\n"; //let's get to work
                this.spaces += 4;
                for(const [key, value] of classStatement.properties) {
                    result += "".padStart(this.spaces); //or we could do result = result.padEnd(this.spaces)
                    if(key.static) {
                        result += "static ";
                    }
                    if(key instanceof BlockStatement) {
                        //static block
                        //oh... i didn't bother setting key.static on the static block when i parsed it...
                        //oh... i'm worried if i change it now something might break...
                        result += "static " + key.accept(this);
                    }else if(key instanceof Token) {
                        result += key.value + ";";
                    }else {
                        let bl = "";
                        let br = "";
                        if(key.computed) {
                            bl = "[";
                            br = "]";
                        }
                        if(key.method) {
                            let prefix = "";
                            if(value.kindSoThatICanDoThisStuffCorrectly == FunctionKind.GETTER) {
                                prefix = "get ";
                            }
                            if(value.kindSoThatICanDoThisStuffCorrectly == FunctionKind.SETTER) {
                                prefix = "set ";
                            }
                            const space = !!(value.isAsync || value.isGenerator);
                            result += `${value.isAsync ? "async" : ""}${value.isGenerator ? "*" : ""}${space ? " " : ""}${prefix}${bl}${key.accept(this)}${br}${this.parameters(value.parameters)} ${value.body.accept(this)}`;
                        }else {
                            result += `${bl}${key.accept(this)}${br} = ${value.accept(this)};`;
                        }
                    }
                    result += "\n";
                }
                //we'll do the constructor now i guess lol
                //lawl forgot the $
                if(classStatement.$constructor) {
                    result += `${"".padStart(this.spaces)}constructor${this.parameters(classStatement.$constructor.parameters)} ${classStatement.$constructor.body.accept(this)}\n`;
                }
                this.spaces -= 4;
                return result + "}";
            }

            /** @param {AssignmentExpression} assignmentExpression */
            visitAssignmentExpression(assignmentExpression) {
                return this.visitBinaryExpression(assignmentExpression);
            }

            /** @param {SuperPropertyExpression} superPropertyExpression */
            visitSuperPropertyExpression(superPropertyExpression) {
                return `(super${superPropertyExpression.operator.value}${superPropertyExpression.propertyExpr.accept(this)}${superPropertyExpression.operator.value == "[" ? "]" : ""})`;
            }

            /** @param {SuperCallExpression} superCallExpression */
            visitSuperCallExpression(superCallExpression) {
                return `(super(${superCallExpression.argumentsExprArr.map(v=>v.accept(this))}))`;
            }

            /** @param {NewTargetExpression} newTargetExpression */
            visitNewTargetExpression(newTargetExpression) {
                return `(new.target)`;
            }

            /** @param {WithStatement} withStatement */
            visitWithStatement(withStatement) {
                return `with(${withStatement.object.accept(this)}) ${withStatement.stmt.accept(this)}`;
            }
        }

        execute.addEventListener("click", function(event) {
            let interpreter = new JavascriptInterpreter();
            // console.log("$0:", interpreter.interpret(letext.value));
            console.larp["[[Call]]"](undefined, [interpreter.interpret(letext.value)]);
        });
    </script>
