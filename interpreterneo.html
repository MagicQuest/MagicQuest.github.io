        //expressions can happen after semicolons, in parenthesis and at the beginning of lines
        //if a line starts with a reserved word we should switch based on the value
        
        //based on std::expected, but this could've also been rust's Result if i was in my rust era again
        /** @template [T=object, K=object] */
        class Expected {
            /** @type {T?} */
            value;
            /** @type {K?} */
            error;
            /**
             * @param {T?} value
             * @param {K?} error
             */
            constructor(value, error = undefined) {
                this.value = value;
                this.error = error;
            }
            has_value() {
                return this.value != undefined;
            }
        }

        function Unexpected(error) {
            return new Expected(undefined, error);
        }

        class ParseError {
            line;
            char;
            reason;
            constructor(line, char, reason) {
                this.line = line;
                this.char = char;
                this.reason = reason;
            }
            /** 
             * @param {String} source
             * @returns {String}
             */
            toString(source) {
                const lines = source.split("\n");
                let errorMessage = `Line: ${this.line}, Character: ${this.char}\n#### ${this.reason} ####\n${lines[this.line-1]}\n`;
                //for(let i = 0; i < this.char-1; i++) { // i feel like this loop is crazy but is there another way to do it (in javascript)
                //    errorMessage += " ";
                //}

                //oh yeah lol padStart i did it earlier
                errorMessage += "".padStart(this.char-1, " ");

                errorMessage += "^ HERE";
                // console.error(errorMessage);
                //throw errorMessage;
                return errorMessage;
            }
        }

        class Token {
            line;
            char;
            kind;
            value;
            constructor(line, char, kind, value) {
                this.line = line;
                this.char = char;
                this.kind = kind;
                this.value = value;
            }
        }

        function indexFromToken(token, sourceText) {
            let i = 0;
            for(let line = 1; line < token.line; line++) {
                i = sourceText.indexOf("\n", i)+1;
            }
            return i+(token.char-1);
        }

        class Interpreter {
            /** 
             * @param {String} str
             * @returns {Expected<Array, ParseError>}
             * */
            parse(str) {} // = 0;
            interpret(str) {
                const result = this.parse(str);
                if(!result.has_value()) {
                    const err = result.error.toString(str);
                    letext.style.backgroundColor = "pink";
                    //addConsoleText(true, [err]);
                    const temp = err.split("\n");
                    temp[temp.length-1] = "(this font isn't monospace so see the console for the correct character position)";
                    letext.setAttribute("title", temp.join("\n"));
                    throw err;
                }
                letext.style.backgroundColor = "";
                letext.removeAttribute("title");
                console.log(result.value);
                //etc...
            }
        }

        class Lexer {
            /** @type {Interpreter} */
            interpreter;
            /** @param {Interpreter} interpreter */
            constructor(interpreter) {
                this.interpreter = interpreter;
            }

            /**
             * @param {String} str
             * @returns {Expected<Array<Token>, ParseError>} */
            lex(str) {}; // = 0;
        }

        class Parser {
            /** @type {Interpreter} */
            interpreter;
            /** @type {Array<Token>} */
            tokens;
            /**
             * @param {Interpreter} interpreter
             * @param {Array<Token>} tokens */
            constructor(interpreter, tokens) {
                this.interpreter = interpreter;
                this.tokens = tokens;
            }

            /**
             * @returns {Expected<Array<Statement>, ParseError>} */
            parse() {}; // = 0;

        class HostLanguage {

            static hasBigNumbers() {

        //lexical grammar for javascript
        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar
        //we're not doing that identifier unicode escape sequence shit lol (actually maybe it wouldn't be TOO hard)
        //my number production rule implies that 100e+2e+2 and 0755n are valid but we'll fix that in post
        //identifier ::= /[$_\p{ID_Start}][$\p{ID_Continue}]*/u
        //privateIdentifier ::= '#' identifier
        //number ::= sign? ((hex | octal | binary) | ([0-9]* ('.' [0-9]*)?)) ('n' | ([eE] number))?
        //hex ::= '0' [xX] [0-9a-fA-F]+
        //octal ::= '0' [oO] [0-7]+
        //binary ::= '0' [bB] [0-1]+
        //sign ::= '+' | '-'
        //string ::= (["'`]).+\1
        //regex ::= '/' .+ '/' [gimsuy]*
        class JavascriptLexer extends Lexer {
            static reserved = new Map([
                //regular
                ["break", true],
                ["case", true],
                ["catch", true],
                ["class", true],
                ["const", true],
                ["continue", true],
                ["debugger", true],
                ["default", true],
                ["delete", true],
                ["do", true],
                ["else", true],
                ["export", true],
                ["extends", true],
                ["false", true],
                ["finally", true],
                ["for", true],
                ["function", true],
                ["if", true],
                ["import", true],
                ["in", true],
                ["instanceof", true],
                ["new", true],
                ["null", true],
                ["return", true],
                ["super", true],
                ["switch", true],
                ["this", true],
                ["throw", true],
                ["true", true],
                ["try", true],
                ["typeof", true],
                ["var", true],
                ["void", true],
                ["while", true],
                ["with", true],

                //strict mode
                // ["let", true],
                // ["static", true],
                // ["yield", true],

                //in modules or async functions (wait a second, doesn't that make javascript context... sensitive?!)
                ["await", true],

                //future reserved
                ["enum", true],

                //strict mode
                // ["implements", true],
                // ["interface", true],
                // ["package", true],
                // ["private", true],
                // ["protected", true],
                // ["public", true]
            ]);

            static strict_reserved = new Map([
                //regular
                ["let", true],
                ["static", true],
                ["yield", true],

                //future reserved
                ["implements", true],
                ["interface", true],
                ["package", true],
                ["private", true],
                ["protected", true],
                ["public", true]
            ]);

            i = 0;

            /** @param {JavascriptInterpreter} parentInterpreter */
            constructor(parentInterpreter) {
                super(parentInterpreter);
            }

            /** 
             * @param {String} str
             * @returns {Expected<Array<Token>, ParseError>} */
            lex(str, readingTemplate = false) {
                debugger;

                /** @type {Array<Token>} */
                const tokens = [];

                //let i = 0;
                let lineNumber = 1;
                let lineIndex = 0;

                let useStrict = [false];

                let depth = {
                    parenthesis: 0,
                    bracket: 0,
                    curly: +readingTemplate,
                    inStrictFunctionOrClassBracketEndingDepth: [{kind: undefined, curly: -1, strict: undefined}], // when we reach a closing bracket we'll check this number to disable strict mode if needed
                };

                if(str.length > 1) {
                    if(str[0] == '#' && str[1] == '!') {
                        str = str.replace("#!", "//"); //lol
                    }
                }

                const isNumberRegex = /[0-9]/;
                const identifierStartRegex = /[$_\p{ID_Start}]/u;
                const identifierRegex = /[$\p{ID_Continue}]/u;

                const hexRegex = /[0-9a-f_]/i;
                const octalRegex = /[0-7_]/;

                // let startOfFunctionBlockTokenLength = [{length: -1, ref: undefined}];
                let startOfFunctionBlockTokenLength = [0]; // this variable will be set to the length of tokens after the open curly bracket, if a "use strict" string is found, and (tokens.length - startOfFunctionBlock) == 0, this was the first thing in the function (blocks cannot be strict apparently)

                templateStopLexing:
                while(this.i < str.length) {
                    const char = str[this.i++];
                    const charNumber = this.i - lineIndex;
                    switch(char) {
                        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#white_space
                        case '\t':
                        case '\v':
                        case '\f':
                        case ' ':
                        case '\r': //probably fine
                        case '\u00A0': //nbsp
                        case '\uFEFF': //bom marker
                        //<USP>...
                            continue;

                        case '/':
                            if(str[this.i] == '/') {
                                //comment
                                this.i = str.indexOf("\n", this.i);
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '*') {
                                //multiline comment
                                const target = str.indexOf("*/", this.i)+2;
                                while((this.i = str.indexOf("\n", this.i)+1) < target) { //uhh probably right
                                    lineNumber++;
                                    lineIndex = this.i;
                                }
                                this.i = target;
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '=') {
                                //consume =
                                this.i++;
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.DIV_EQUALS, "/="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.SLASH, "/"));
                            }
                            break;

                        case '\n': //automagic semicolon insertion...
                            lineNumber++;
                            lineIndex = this.i;
                            break;

                        case '"':
                        case '\'':
                        case '`': {
                            const stringToken = new Token(lineNumber, charNumber, TokenKind.STRING, "");
                            let escaped = false;
                            let ended = false;
                            while(this.i < str.length) {
                                if(str[this.i] == char) {
                                    this.i++; //consume ending quote
                                    ended = true;
                                    break;
                                }
                                if(str[this.i] == '\n') {
                                    lineNumber++;
                                    lineIndex = this.i;
                                    this.i++; //consume newline
                                    if(!escaped) {
                                        if(char == '`') {
                                            //backtick allows multiline string
                                            stringToken.value += "\n";
                                        }else {
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "Use a backslash for multiline strings! (or use the backtick quote '`')"));
                                        }
                                    }else {
                                        escaped = false;
                                    }
                                }else if(str[this.i] == '\\') {
                                    //escape!
                                    this.i++; //consume \
                                    switch(str[this.i]) {
                                        case '0':
                                            stringToken.value += '\0';
                                            //here is the part where i'd disallow octal escapes per https://tc39.es/ecma262/multipage/strict-mode-of-ecmascript.html#sec-strict-mode-of-ecmascript
                                            //useStrict.at(-1)
                                            break;
                                        case '1':
                                        case '2':
                                        case '3':
                                        case '4':
                                        case '5':
                                        case '6':
                                        case '7':
                                        case '8':
                                        case '9':
                                        case 'x':
                                        case 'u':
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "We're not doing all that fancy escape stuff bruh"));
                                            break;
                                        case '\'':
                                            stringToken.value += '\'';
                                            break;
                                        case '"':
                                            stringToken.value += '\"';
                                            break;
                                        case '\\':
                                            stringToken.value += '\\';
                                            break;

                if(this.i < this.tokens.length && this.tokens[this.i].kind == TokenKind.RESERVED && this.tokens[this.i].value == value) {
                    return this.tokens[this.i++]; //consume!
                }

            peek(kind) {
                return this.i < this.tokens.length && this.tokens[this.i].kind == kind;
            }

            peekReserved(value) {
                return this.peek(TokenKind.RESERVED) && this.tokens[this.i].value == value;
            }

            peekNext(kind) {
                return this.i+1 < this.tokens.length && this.tokens[this.i+1].kind == kind;
            }

            consume(kind, errorMessage) {
                if(this.i < this.tokens.length) {
                    if(this.tokens[this.i].kind == kind) {
                        this.i++;
                    }else {
                        throw new ParseError(this.tokens[this.i].line, this.tokens[this.i].char, errorMessage);
                    }
                }else {
                    throw new ParseError(this.tokens[this.i-1].line, this.tokens[this.i-1].char, errorMessage + " (line ended unexpectedly!)");

            }

                return new IdentifierExpression(id);

            pushHoistedDeclarations() {
                // const statements = this.inFunction.at(-1) || this.statements;
                const scope = this.scope[this.scope.length-1]; //not using .at because for some reason vscode acts like it doesn't know the types anymore
                const statements = scope.blockStatementArray;
                /** @type {Array<StaticAnalysisFunctionVariable>} */
                const tempFunctions = [];
                let j = 0;
                for(const $var of scope.hoisted) {
                    if($var.qualifier.value == "var") {
                        //splicing at i so they're in order even though that's probably not important
                        statements.splice(j, 0, new VariableDeclarationStatement($var.gender, $var.qualifier, $var.name.value, undefined));
                        j++;
                    }else if($var.qualifier.value == "function") {
                        //with my new implementation, do function need the temporal dead zone? (or did they ever?)
                        tempFunctions.push($var);
                    }else {
                        //temporal dead zone...
                        statements.splice(j, 0, new TemporalDeadZoneDeclarationStatement($var.gender, $var.qualifier, $var.name.value, undefined));
                        j++;
                    }
                }
                for(const $var of tempFunctions) {
                    //we put actual functions after all declarations so that the functions can reference each other as well as all local variables
                    statements.splice(j, 0, $var.statement);
                    j++;
                }

                // this.hoistedVars = [];
            }

            directivePrologue() {
                const old = this.i;
                while(this.tokens.length && this.peek(TokenKind.STRING)) {
                    const string = this.tokens[this.i++];
                    if(!this.match(TokenKind.SEMICOLON)) {
                        break;
                    }
                    if(string.value == "use strict") {
                        this.useStrict = true;
                    }
                    // this.consume(TokenKind.SEMICOLON, "Expected semicolon to separate string expression statements in directive prologue");
                }
                this.i = old; //reset lol
            }

            /**
             * @param {Array<Token>} tokens
             * @returns {Expected<Array<Statement>, ParseError>} */
            parse() /*override*/ {
                //if(this.tokens.length && this.tokens[0].kind == TokenKind.STRING && this.tokens[0].value == "use strict") {
                //    this.useStrict = true;
                //}

                this.directivePrologue();

                //i'm being lazy as FUCK here because i just remembered the lexer and parser have access to the interpreter
                // this.interpreter.state.strict = this.useStrict;
                this.interpreter.state.SetStrict(this.useStrict);

                ///** @type {Array<Statement>} */
                //const statements = [];
                try {
                    while(this.i < this.tokens.length) {
                        const statement = this.declaration();
                        if(statement instanceof FunctionStatement) {
                            //we hoist function statements to the top of the scope
                            //this.statements.splice(0, 0, statement);

                            //actually we'll do this with the rest of the hoisted vars
                        }else {
                            this.statements.push(statement);
                        }
                    }
                }catch(e) {
                    //when i was using std expected i never thought to throw instead of propagating the expected out
                    if(!(e instanceof ParseError)) {
                        throw e; //lmao
                    }
                    return Unexpected(e);
                }

                //this.pushHoistedDeclarations(this.statements);
                this.pushHoistedDeclarations();

                return new Expected(this.statements);
            }
        }

        class DeclarativeEnvironmentRecord extends EnvironmentRecord {
            /** @type {Array<DisposableResourceRecord>} */
            ["[[DisposableResourceStack]]"] = [];

            HasBinding(name) /*override*/ {
                return this.bindings.has(name);
            }

            CreateMutableBinding(name, deletable) /*override*/ {
                //Assert: !this.bindings.has(name)
                this.bindings.set(name, new MutableBinding(deletable));
                return undefined; //UNUSED
            }

            CreateImmutableBinding(name, strict) /*override*/ {
                //Assert: !this.bindings.has(name)
                this.bindings.set(name, new ImmutableBinding(strict));
                return undefined; //UNUSED
            }

            InitializeBinding(name, value) /*override*/ {
                //Assert: this.bindings.get(name) && this.bindings.get(name).initialized == false
                const binding = this.bindings.get(name);
                binding.initialized = true;
                binding.value = value;
                return undefined; //UNUSED
            }

            SetMutableBinding(name, value, strict) /*override*/ {
                if(!this.HasBinding(name)) { // this isn't LITERALLY what it says but this means exactly the same thing

                        //"use strict";
                        //variable = 2;
                        throw new ReferenceError(`${name} is not defined`); //is this the right error message?
                    }
                    this.CreateMutableBinding(name, true);
                    this.InitializeBinding(name, value);
                    return undefined; //UNUSED
                }
                const binding = this.bindings.get(name);
                if(binding.strict) strict = true;
                if(!binding.initialized) {
                    //x = 5;
                    //let x = 2;
                    throw new ReferenceError(`Cannot access '${name}' before initialization`);

                    //x = 5;
                    throw new TypeError("Assignment to constant variable.");
                }
                return undefined; //UNUSED
            }

            GetBindingValue(name, strict) /*override*/ {
                //Assert: this.HasBinding(name)
                const binding = this.bindings.get(name);
                if(!binding.initialized) {
                    //x;
                    //let x = 2;
                    throw new ReferenceError(`Cannot access '${name}' before initialization`);
                }
                return binding.value;
            }

            DeleteBinding(name) /*override*/ {
                //Assert: this.HasBinding(name)
                const binding = this.bindings.get(name);

                }
                this.bindings.delete(name);
                return true;

            GetThisBinding() /*override*/ {

            HasSuperBinding() /*override*/ {

            }

            WithBaseObject() /*override*/ {

            }

            /** @param {FunctionStatement} functionStatement */
            visitFunctionStatement(functionStatement) {
                let prefix = "function";
                if(functionStatement.kindSoThatICanDoThisStuffCorrectly == FunctionKind.GETTER) {
                    prefix = "get";
                }else if(functionStatement.kindSoThatICanDoThisStuffCorrectly == FunctionKind.SETTER) {
                    prefix = "set";
                }
                return `${functionStatement.genderToken ? functionStatement.genderToken.value+" " : ""}${functionStatement.isAsync ? "async " : ""}${prefix}${functionStatement.isGenerator ? "*" : ""}${functionStatement.nameToken.value ? " "+functionStatement.nameToken.value : ""}${this.parameters(functionStatement.parameters)} ${functionStatement.body.accept(this)}`;
            }

            /** @param {ReturnStatement} returnStatement */
            visitReturnStatement(returnStatement) {
                return `return ${returnStatement.expr.accept(this)};`;
            }

            /** @param {DebuggerStatement} debuggerStatement */
            visitDebuggerStatement(debuggerStatement) {
                return `debugger;`;
            }

            /** @param {ArrayLiteralExpression} arrayLiteralExpression */
            visitArrayLiteralExpression(arrayLiteralExpression) {
                return `[${arrayLiteralExpression.value.map(v=>v.accept(this))}]`;
            }

            /** @param {ObjectLiteralExpression} objectLiteralExpression */
            visitObjectLiteralExpression(objectLiteralExpression) {
                let result = "{";
                const entries = objectLiteralExpression.properties.entries();
                let i = 0;
                for(const [key, value] of entries) {
                    if(i > 0) {
                        result += ", ";
                    }
                    if(key instanceof Token) {
                        result += key.value;
                    }else if(key instanceof SpreadExpressionToBeEvaluatedManuallyBecauseContextIsImportant) {
                        result += `...${key.rhs.accept(this)}`;
                    }else if((key instanceof IdentifierExpression || (key instanceof LiteralExpression && (typeof key.value == "number" || typeof key.value == "string"))) && !key.computed) {
                        result += `${key.accept(this)}: ${value.accept(this)}`; //omit the brackets (even though it's still valid javascript)
                    }else {
                        result += `[${key.accept(this)}]: ${value.accept(this)}`;
                    }
                    i++;
                }
                return result + "}";
            }

            /** @param {ClassStatement} classStatement */
            visitClassStatement(classStatement) {
                throw error;
            }

            /** @param {AssignmentExpression} assignmentExpression */
            visitAssignmentExpression(assignmentExpression) {
                return this.visitBinaryExpression(assignmentExpression);
            }

            /** @param {SuperPropertyExpression} superPropertyExpression */
            visitSuperPropertyExpression(superPropertyExpression) {
                return `(super${superPropertyExpression.operator.value}${superPropertyExpression.propertyExpr.accept(this)}${superPropertyExpression.operator.value == "[" ? "]" : ""})`;
            }

            /** @param {SuperCallExpression} superCallExpression */
            visitSuperCallExpression(superCallExpression) {
                return `(super(${superCallExpression.argumentsExprArr.map(v=>v.accept(this))}))`;
            }
        }

        execute.addEventListener("click", function(event) {
            let interpreter = new JavascriptInterpreter();
            console.log("$0:", interpreter.interpret(letext.value));
        });
    </script>
