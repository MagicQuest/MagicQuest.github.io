        //expressions can happen after semicolons, in parenthesis and at the beginning of lines
        //if a line starts with a reserved word we should switch based on the value
        
        //based on std::expected, but this could've also been rust's Result if i was in my rust era again
        /** @template [T=object, K=object] */
        class Expected {
            /** @type {T?} */
            value;
            /** @type {K?} */
            error;
            /**
             * @param {T?} value
             * @param {K?} error
             */
            constructor(value, error = undefined) {
                this.value = value;
                this.error = error;
            }
            has_value() {
                return this.value != undefined;
            }
        }

        function Unexpected(error) {
            return new Expected(undefined, error);
        }

        class ParseError {
            line;
            char;
            reason;
            constructor(line, char, reason) {
                this.line = line;
                this.char = char;
                this.reason = reason;
            }
            /** 
             * @param {String} source
             * @returns {String}
             */
            toString(source) {
                const lines = source.split("\n");
                let errorMessage = `Line: ${this.line}, Character: ${this.char}\n#### ${this.reason} ####\n${lines[this.line-1]}\n`;
                //for(let i = 0; i < this.char-1; i++) { // i feel like this loop is crazy but is there another way to do it (in javascript)
                //    errorMessage += " ";
                //}

                //oh yeah lol padStart i did it earlier
                errorMessage += "".padStart(this.char-1, " ");

                errorMessage += "^ HERE";
                // console.error(errorMessage);
                //throw errorMessage;
                return errorMessage;
            }
        }

        class Token {
            line;
            char;
            kind;
            value;
            constructor(line, char, kind, value) {
                this.line = line;
                this.char = char;
                this.kind = kind;
                this.value = value;
            }
        }

        class Interpreter {
            /** 
             * @param {String} str
             * @returns {Expected<Array, ParseError>}
             * */
            parse(str) {} // = 0;
            interpret(str) {
                const result = this.parse(str);
                if(!result.has_value()) {
                    const err = result.error.toString(str);
                    letext.style.backgroundColor = "pink";
                    //addConsoleText(true, [err]);
                    const temp = err.split("\n");
                    temp[temp.length-1] = "(this font isn't monospace so see the console for the correct character position)";
                    letext.setAttribute("title", temp.join("\n"));
                    throw err;
                }
                letext.style.backgroundColor = "";
                letext.removeAttribute("title");
                console.log(result.value);
                //etc...
            }
        }

        class Lexer {
            /** @type {Interpreter} */
            interpreter;
            /** @param {Interpreter} interpreter */
            constructor(interpreter) {
                this.interpreter = interpreter;
            }

            /**
             * @param {String} str
             * @returns {Expected<Array<Token>, ParseError>} */
            lex(str) {}; // = 0;
        }

        class Parser {
            /** @type {Interpreter} */
            interpreter;
            /** @type {Array<Token>} */
            tokens;
            /**
             * @param {Interpreter} interpreter
             * @param {Array<Token>} tokens */
            constructor(interpreter, tokens) {
                this.interpreter = interpreter;
                this.tokens = tokens;
            }

            /**
             * @returns {Expected<Array<Statement>, ParseError>} */
            parse() {}; // = 0;
        }

        class HostLanguage {
            //in javascript we do!
            static hasBigNumbers() {
                return true;
            }
            static isJavascriptTruthy(value) {
                return !!value;
            }
            static isJavascriptFalsy(value) {
                return !value;
            }
        }

        //lexical grammar for javascript
        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar
        //we're not doing that identifier unicode escape sequence shit lol (actually maybe it wouldn't be TOO hard)
        //my number production rule implies that 100e+2e+2 and 0755n are valid but we'll fix that in post
        //identifier ::= /[$_\p{ID_Start}][$\p{ID_Continue}]*/u
        //number ::= sign? ((hex | octal | binary) | ([0-9]* ('.' [0-9]*)?)) ('n' | ([eE] number))?
        //hex ::= '0' [xX] [0-9a-fA-F]+
        //octal ::= '0' [oO] [0-7]+
        //binary ::= '0' [bB] [0-1]+
        //sign ::= '+' | '-'
        //string ::= (["'`]).+\1
        //regex ::= '/' .+ '/' [gimsuy]*
        class JavascriptLexer extends Lexer {
            static reserved = new Map([
                //regular
                ["break", true],
                ["case", true],
                ["catch", true],
                ["class", true],
                ["const", true],
                ["continue", true],
                ["debugger", true],
                ["default", true],
                ["delete", true],
                ["do", true],
                ["else", true],
                ["export", true],
                ["extends", true],
                ["false", true],
                ["finally", true],
                ["for", true],
                ["function", true],
                ["if", true],
                ["import", true],
                ["in", true],
                ["instanceof", true],
                ["new", true],
                ["null", true],
                ["return", true],
                ["super", true],
                ["switch", true],
                ["this", true],
                ["throw", true],
                ["true", true],
                ["try", true],
                ["typeof", true],
                ["var", true],
                ["void", true],
                ["while", true],
                ["with", true],

                //strict mode
                // ["let", true],
                // ["static", true],
                // ["yield", true],

                //in modules or async functions (wait a second, doesn't that make javascript context... sensitive?!)
                ["await", true],

                //future reserved
                ["enum", true],

                //strict mode
                // ["implements", true],
                // ["interface", true],
                // ["package", true],
                // ["private", true],
                // ["protected", true],
                // ["public", true]
            ]);

            static strict_reserved = new Map([
                //regular
                ["let", true],
                ["static", true],
                ["yield", true],

                //future reserved
                ["implements", true],
                ["interface", true],
                ["package", true],
                ["private", true],
                ["protected", true],
                ["public", true]
            ]);

            i = 0;

            /** @param {JavascriptInterpreter} parentInterpreter */
            constructor(parentInterpreter) {
                super(parentInterpreter);
            }

            /** 
             * @param {String} str
             * @returns {Expected<Array<Token>, ParseError>} */
            lex(str, readingTemplate = false) {
                debugger;

                /** @type {Array<Token>} */
                const tokens = [];

                //let i = 0;
                let lineNumber = 1;
                let lineIndex = 0;

                let useStrict = false;

                let depth = {
                    parenthesis: 0,
                    bracket: 0,
                    curly: +readingTemplate
                };

                if(str.length > 1) {
                    if(str[0] == '#' && str[1] == '!') {
                        str = str.replace("#!", "//"); //lol
                    }
                }

                const isNumberRegex = /[0-9]/;
                const identifierStartRegex = /[$_\p{ID_Start}]/u;
                const identifierRegex = /[$\p{ID_Continue}]/u;

                const hexRegex = /[0-9a-f_]/i;
                const octalRegex = /[0-7_]/;

                templateStopLexing:
                while(this.i < str.length) {
                    const char = str[this.i++];
                    const charNumber = this.i - lineIndex;
                    switch(char) {
                        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#white_space
                        case '\t':
                        case '\v':
                        case '\f':
                        case ' ':
                        case '\r': //probably fine
                        case '\u00A0': //nbsp
                        case '\uFEFF': //bom marker
                        //<USP>...
                            continue;

                        case '/':
                            if(str[this.i] == '/') {
                                //comment
                                this.i = str.indexOf("\n", this.i);
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '*') {
                                //multiline comment
                                const target = str.indexOf("*/", this.i)+2;
                                while((this.i = str.indexOf("\n", this.i)+1) < target) { //uhh probably right
                                    lineNumber++;
                                    lineIndex = this.i;
                                }
                                this.i = target;
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '=') {
                                //consume =
                                this.i++;
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.DIV_EQUALS, "/="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.SLASH, "/"));
                            }
                            break;

                        case '\n': //automagic semicolon insertion...
                            lineNumber++;
                            lineIndex = this.i;
                            break;

                        case '"':
                        case '\'':
                        case '`': {
                            const stringToken = new Token(lineNumber, charNumber, TokenKind.STRING, "");
                            let escaped = false;
                            let ended = false;
                            while(this.i < str.length) {
                                if(str[this.i] == char) {
                                    this.i++; //consume ending quote
                                    ended = true;
                                    break;
                                }
                                if(str[this.i] == '\n') {
                                    lineNumber++;
                                    lineIndex = this.i;
                                    this.i++; //consume newline
                                    if(!escaped) {
                                        if(char == '`') {
                                            //backtick allows multiline string
                                            stringToken.value += "\n";
                                        }else {
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "Use a backslash for multiline strings! (or use the backtick quote '`')"));
                                        }
                                    }else {
                                        escaped = false;
                                    }
                                }else if(str[this.i] == '\\') {
                                    //escape!
                                    this.i++; //consume \
                                    switch(str[this.i]) {
                                        case '0':
                                            stringToken.value += '\0';
                                            break;
                                        case '1':
                                        case '2':
                                        case '3':
                                        case '4':
                                        case '5':
                                        case '6':
                                        case '7':
                                        case '8':
                                        case '9':
                                        case 'x':
                                        case 'u':
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "We're not doing all that fancy escape stuff bruh"));
                                            break;
                                        case '\'':
                                            stringToken.value += '\'';
                                            break;
                                        case '"':
                                            stringToken.value += '\"';
                                            break;
                                        case '\\':
                                            stringToken.value += '\\';
                                            break;
                                        case 'n':
                                            stringToken.value += '\n';
                                            break;
                                        case 'r':
                                            stringToken.value += '\r';
                                            break;
                                        case 'v':
                                            stringToken.value += '\v';
                                            break;
                                        case 't':
                                            stringToken.value += '\t';
                                            break;
                                        case 'b':
                                            stringToken.value += '\b';
                                            break;
                                        case 'f':
                                            stringToken.value += '\f';
                                            break;
                                        case '\r':
                                            if(str[this.i+1] == '\n') {
                                                //eval(`"\\\r\n"`);
                                                this.i++; //consume \r
                                                //[[fallthrough]]
                                            }else {
                                                stringToken.value += '\r';
                                                break;
                                            }
                                        case '\n':
                                            escaped = true;
                                            this.i--; //don't consume the newline!
                                            break;
                                        default:
                                            stringToken.value += str[this.i];
                                            break;
                                    }
                                    this.i++; //consume whatever character that was
                                }else if(char == '`' && str[this.i] == '$') {
                                    if(str[this.i+1] == '{') {
                                        const templateCharNumber = this.i - lineIndex;
                                        this.i+=2; //consume dollar and curly bracket
                                        //template
                                        const result = this.lex(str, true); // who knew making the lexer its own object would come in handy (i'm actually talking about using this.i)
                                        if(!result.has_value()) {
                                            return result;
                                        }
                                        tokens.push(new Token(lineNumber, templateCharNumber, TokenKind.TEMPLATE_EXPRESSION, result.value));
                                    }else {
                                        stringToken.value += str[this.i++];
                                    }
                                }else {
                                    stringToken.value += str[this.i++];
                                }
                            }
                            if(!ended) {
                                return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "End of file reached before ending string quote!"));
                            }
                            if(tokens.length == 0 && stringToken.value == "use strict") { //lol
                                useStrict = true;
                            }
                            tokens.push(stringToken);
                            break;
                        }

                        case '?':
                            if(str[this.i] == '.') {
                                this.i++; //consume dot
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.OPTIONAL_CHAINING, "?."));
                            }else if(str[this.i] == '?') {
                                this.i++; //consume ?
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.NULLISH_COALESCING_EQUALS, "??="));
                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.NULLISH_COALESCING, "??"));
                                }
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.QUESTION, "?"));
                            }
                            break;

                        case ':':
                            tokens.push(new Token(lineNumber, charNumber, TokenKind.COLON, ":"));
                            break;

                        case ';':
                            tokens.push(new Token(lineNumber, charNumber, TokenKind.SEMICOLON, ";"));
                            break;

                        case '+':
                            if(str[this.i] == '+') {
                                this.i++; //consume +
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.INCREMENT, "++"));
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.PLUS_EQUALS, "+="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.PLUS, "+"));
                            }
                            break;

                        case '-':
                            if(str[this.i] == '-') {
                                this.i++; //consume -
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.DECREMENT, "--"));
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MINUS_EQUALS, "-="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MINUS, "-"));
                            }
                            break;

                        case '*':
                            if(str[this.i] == '*') {
                                this.i++; //consume *
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.EXPONENTIATION_EQUALS, "**="));
                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.EXPONENTIATION, "**"));
                                }
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MUL_EQUALS, "*="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.ASTERISK, "*"));
                            }
                            break;

                        case '%':
                            if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.REMAINDER_EQUALS, "%="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.REMAINDER, "%"));
                            }
                            break;

                        case '<':
                            if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.LESS_EQUAL, "<="));
                            }else if(str[this.i] == '<') {
                                this.i++; //consume <
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_SHIFT_LEFT_EQUALS, "<<="));
                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_SHIFT_LEFT, "<<"));
                                }
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.LESS_THAN, "<"));
                            }
                            break;

                        case '>':
                            if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.GREATER_EQUAL, ">="));
                            }else if(str[this.i] == '>') {
                                this.i++; //consume >
                                if(str[this.i] == '>') {
                                    this.i++; //consume >
                                    if(str[this.i] == '=') {
                                        this.i++; //consume =
                                        tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT_EQUALS, ">>>="));
                                    }else {
                                        tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT, ">>>"));
                                    }

            term() {

            factor() {

                    //by calling this.exponentiation, it will return an expression already containing the next subsequent exponentiations, thus making expr = expr ** (expr ...)
                    expr = new BinaryExpression(expr, this.tokens[this.i++], this.exponentiation());

            unary_prefix() {

            /**
             * @param {Token | false} gender

             */
            doCommonIdentifierDeclStuff(gender, qualifier, name) {
                let value = undefined;
                const equals = this.match(TokenKind.EQUALS);
                //this probably shouldn't happen this way but hush!
                let inFor = this.peekReserved("in") || (this.peek(TokenKind.IDENTIFIER) && this.tokens[this.i].value == "of");
                if(equals) {

                    value = this.unary_misc();

                    inFor = this.peekReserved("in") || (this.peek(TokenKind.IDENTIFIER) && this.tokens[this.i].value == "of");
                }else if(!inFor && qualifier.value == "const") {
                    const temp = +!this.peek(TokenKind.SEMICOLON); //we'll do the token before this one if this one isn't a semicolon (because whatever token that isn't a semicolon might be on another line!)
                    throw new ParseError(this.tokens[this.i-temp].line, this.tokens[this.i-temp].char, "Missing initializer in const declaration");
                }

                //probably expect a semicolon?
                //yeah this seems very not recursive descent in that this isn't specified in the grammar but lowkey this for shit is weird so hush!
                if(!inFor) {
                    this.consume(TokenKind.SEMICOLON, "Semicolon expected after variable declaration!");
                }
                // "k";

                let index = this.scope.length-1;
                let scope = this.scope[index];
                if(qualifier.value == "var") {
                    while(scope.kind == "block") { //var declarations are only scoped to function/global
                        scope = this.scope[--index];
                    }
                }
                if(scope.variables.has(name.value)) {
                    const old = scope.variables.get(name.value);
                    if(qualifier.value != "var" || qualifier.value != old.qualifier.value || gender?.value != old.gender?.value) { //we can redeclare with var, but not with let or const!
                        //bad (boy | girl | thing)!
                        //i forgot where i wrote this originally but i just knew this was where it should go once more...
                        throw new ParseError(name.line, name.char, `Identifier '${name.value}' has already been declared!`);
                    }
                }else {
                    const $var = new StaticAnalysisVariable(gender || undefined, qualifier, name);
                    scope.variables.set(name.value, $var);
                    scope.hoisted.push($var);
                }

                if(qualifier.value == "var") {
                    //according to mdn, since vars are hoisted, the declarations are moved to the top and written declarations are changed to assignments
                    const id = new IdentifierExpression(name);
                    if(equals) {
                        return new BinaryExpression(id, equals, value);
                    }else {
                        //var redeclarations with no value don't change the previous value of the variable!

                        //not gonna be the fastest implementation in the west...
                        //i can't be bothered to allow declaration to come up undefined so we'll return an expression statement that does nothing, effectively resulting in the following statement:
                        //id;
                        return new ExpressionStatement(id);
                    }
                }else {
                    return new VariableDeclarationStatement(gender || undefined, qualifier, name.value, value);
                }
            }

            pushHoistedDeclarations() {
                // const statements = this.inFunction.at(-1) || this.statements;
                const scope = this.scope[this.scope.length-1]; //not using .at because for some reason vscode acts like it doesn't know the types anymore
                const statements = scope.blockStatementArray;
                /** @type {Array<StaticAnalysisFunctionVariable>} */
                const tempFunctions = [];
                let i = 0;
                for(i; i < scope.hoisted.length; i++) {
                    const $var = scope.hoisted[i];
                    if($var.qualifier.value == "var") {
                        //splicing at i so they're in order even though that's probably not important
                        statements.splice(i, 0, new VariableDeclarationStatement($var.gender, $var.qualifier, $var.name.value, undefined));
                    }else {
                        //temporal dead zone...
                        statements.splice(i, 0, new TemporalDeadZoneDeclarationStatement($var.gender, $var.qualifier, $var.name.value, undefined));
                        if($var.qualifier.value == "function") {
                            tempFunctions.push($var);
                        }
                    }
                }
                for(const $var of tempFunctions) {
                    //we put actual functions after all declarations so that the functions can reference each other as well as all local variables
                    statements.splice(i, 0, $var.statement);
                    i++;
                }

                // this.hoistedVars = [];
            }

            /**
             * @param {Array<Token>} tokens
             * @returns {Expected<Array<Statement>, ParseError>} */
            parse() /*override*/ {
                if(this.tokens.length && this.tokens[0].kind == TokenKind.STRING && this.tokens[0].value == "use strict") {
                    this.useStrict = true;
                }

                ///** @type {Array<Statement>} */
                //const statements = [];
                try {
                    while(this.i < this.tokens.length) {
                        const statement = this.declaration();
                        if(statement instanceof FunctionStatement) {
                            //we hoist function statements to the top of the scope
                            //this.statements.splice(0, 0, statement);

                            //actually we'll do this with the rest of the hoisted vars
                        }else {
                            this.statements.push(statement);
                        }
                    }
                }catch(e) {
                    //when i was using std expected i never thought to throw instead of propagating the expected out
                    if(!(e instanceof ParseError)) {
                        throw e; //lmao
                    }
                    return Unexpected(e);
                }

                //this.pushHoistedDeclarations(this.statements);
                this.pushHoistedDeclarations();

                return new Expected(this.statements);
            }
        }

                        key = this.evaluate(binaryExpression.right);
                    }else {
                        key = binaryExpression.right.nameToken.value;
                    }
                    //let value;
                    //if(left instanceof JavascriptObjectWrapper) {
                    //    //https://tc39.es/ecma262/#sec-property-accessors
                    //    value = left["[[Get]]"](key, left); //VERY simplified version of what actually happens, receiver should be the reference record of the left hand side?
                    //}else {
                    //    value = left[key];
                    //}
                    //if(value instanceof Function) {
                    //    value = value.bind(left); // for some reason i thought we wouldn't have to do this this time lol
                    //}
                    //return value; //lol!

                    //https://tc39.es/ecma262/#sec-evaluate-property-access-with-identifier-key
                    //const key = this.evaluate(binaryExpression.right).toString(); //explicit toString
                    return new ReferenceRecord(left, key, this.state.strict, undefined); //[[ThisValue]]: EMPTY
                }
                //we can safely evaluate the right :)
                const right = this.evaluate(binaryExpression.right);
                switch(kind) {
                    //comma
                    case TokenKind.COMMA: {
                        //left;
                        return right;
                        break;
                    }
                    
                    //bitwise_or
                    case TokenKind.BITWISE_OR:
                        return left | right;
                        break;
                    
                    //bitwise_x0r
                    case TokenKind.BITWISE_XOR:
                        return left ^ right;
                        break;
                    
                    //bitwise_and
                    case TokenKind.BITWISE_AND:
                        return left & right;
                        break;
                    
                    //equality
                    case TokenKind.STRICT_NOT_EQUAL:
                        return left !== right;
                        break;
                    case TokenKind.STRICT_EQUAL:
                        return left === right;
                        break;
                    case TokenKind.NOT_EQUAL:
                        return left != right;
                        break;
                    case TokenKind.EQUAL_EQUAL:
                        return left == right;
                        break;
                    
                    //comparison
                    case TokenKind.LESS_THAN:
                        return left < right;
                        break;
                    case TokenKind.LESS_EQUAL:
                        return left <= right;
                        break;
                    case TokenKind.GREATER_THAN:
                        return left > right;
                        break;
                    case TokenKind.GREATER_EQUAL:
                        return left >= right;
                        break;
                    case TokenKind.RESERVED:
                        if(binaryExpression.operatorToken.value == "in") {
                            return left in right;
                        }else if(binaryExpression.operatorToken.value == "instanceof") {
                            return left instanceof right;
                        }
                        break;

                    //bitwise_shift
                    case TokenKind.BITWISE_SHIFT_LEFT:
                        return left << right;
                        break;
                    case TokenKind.BITWISE_SHIFT_RIGHT:
                        return left >> right;
                        break;
                    case TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT:
                        return left >>> right;
                        break;
                    
                    //term
                    case TokenKind.PLUS:
                        return left + right; //string concatenation uses a different operator in lua so i'd have to check the types!
                        break;
                    case TokenKind.MINUS:
                        return left - right; //i don't think there's a single math operator that will throw in javascript (which seems crazy but even something like 2 ** [] still works!) so i'd have to do some extra stuff in lua here too.
                        break;

                    //factor
                    case TokenKind.REMAINDER:
                        return left % right;
                        break;
                    case TokenKind.SLASH:
                        return left / right;
                        break;
                    case TokenKind.ASTERISK:
                        return left * right;
                        break;
                    
                    //exponentiation
                    case TokenKind.EXPONENTIATION:
                        return left ** right;
                        break;

                    //access_call
                    //case TokenKind.OPEN_BRACKET:
                    //    let value = left[right];
                    //    if(value instanceof Function) {
                    //        value = value.bind(left);
                    //    }
                    //    return value;
                    //    break;
                }
            }

            /** @param {TernaryExpression} ternaryExpression */
            visitTernaryExpression(ternaryExpression) {
                //if(Environment.isTruthy(ternaryExpression.condition)) {
                //    return ternaryExpression.trueExpr.accept(this);
                //}else {
                //    return ternaryExpression.falseExpr.accept(this);
                //}
                return HostLanguage.isJavascriptTruthy(this.evaluate(ternaryExpression.condition)) ? this.evaluate(ternaryExpression.trueExpr) : this.evaluate(ternaryExpression.falseExpr);
            }

            /** @param {FunctionCallExpression} funcCallExpression */
            visitFunctionCallExpression(funcCallExpression) {
                //const func = funcCallExpression.functionExpr.accept(this);
                //https://tc39.es/ecma262/#sec-function-calls-runtime-semantics-evaluation
                const ref = this.evaluate(funcCallExpression.functionExpr, false);
                const func = this.GetValue(ref); //dereference
                let thisValue;
                if(ref instanceof ReferenceRecord) {
                    if(ref.base instanceof Map) { //!IsPropertyReference
                        if(ref.referencedName == "eval") {
                            if(func == this.state.variables[0].get("eval")) {
                                //direct eval
                                //return...
                            }
                        }
                        //EvaluateCall
                        //thisValue = ref.base.WithBaseObject(); //we don't have the with statement yet so no..
                        thisValue = undefined; //1.b
                    }else {
                        //EvaluateCall
                        thisValue = ref.GetThisValue(); //1.a
                    }
                }else {
                    //EvaluateCall
                    thisValue = undefined; //2.a
                }

                const argList = funcCallExpression.argumentsExprArr.map(v=>this.evaluate(v));

                //duktape
                //if(func instanceof FunctionWrapper) {
                //    //let parent = globalThis;
                //    //if(func.declaration.isStrict) {
                //    //    parent = undefined;
                //    //}
                //    return func.invoke(this, /*parent*/ thisValue, argList);
                //}else
                if(func instanceof JavascriptObjectWrapper) {
                    return ECMAScript.Call(func, thisValue, argList);
                }else {
                    return func.apply(thisValue, argList); //we'll still need something like this in lua so we can call methods of outside objects
                }

                //wait Call will already do these checks :)
                ////if(!(func instanceof JavascriptObjectWrapper)) {
                ////    throw TypeError(`${func} is not a function`);
                ////}
                ////if(!ECMAScript.IsCallable(func)) {
                ////    if(func instanceof Function) {
                ////        //built-in :eyes:
                ////
                ////    }
                ////    throw TypeError(`${func} is not a function`);
                ////}

                //return ECMAScript.Call(func, thisValue, funcCallExpression.argumentsExprArr.map(v=>this.evaluate(v)));
            }

            visitEmptyStatement() {};

            visitDebuggerStatement(debuggerStatement) {
                debugger; //lol
            }

            /** @param {VariableDeclarationStatement} varDeclStatement */
            visitVariableDeclarationStatement(varDeclStatement) {
                //let z, w = (z = 6, 7); //to answer your curiosity, the expression is only evaluated once! let i = 0; let z, w = (i++, z=2, 3);
                //"initializing" 2 vars with let!
                //wait what the fuck?! when i wrote this i thought you couldn't do 2 vars at once!!
                //apparently i could've done let z = 6, w = 7; and it would've worked
                const scope = this.state.variables.at(-1);
                if(scope.has(varDeclStatement.name)) {
                    /** @type {Variable} */
                    const decl = scope.get(varDeclStatement.name);
                    if(decl instanceof TemporalDeadZoneVariable) { //this only applies to let and const
                        //promote to regular var lol
                        const temp = new Variable(decl.properties, varDeclStatement.value && this.evaluate(varDeclStatement.value));
                        scope.set(varDeclStatement.name, temp);
                    }/*else {
                        //my static analysis should handle all this?
                        const oldQualifier = decl.properties.qualifier?.value;
                        const oldGender = decl.properties.gender?.value;
                        if(varDeclStatement.qualifier.value == "const" || varDeclStatement.qualifier.value == "let" || oldQualifier != varDeclStatement.qualifier.value || oldGender != varDeclStatement.gender?.value) {
                            throw new SyntaxError(`Identifier '${varDeclStatement.name}' has already been declared${oldGender != varDeclStatement.gender?.value ? ` (with gender '${oldGender}')` : ""}`);
                        }
                        if(varDeclStatement.value == undefined && varDeclStatement.qualifier.value == "var") {
                            return;
                        }
                    }*/
                    else { //in theory, this only applies to var
                        //using optional chaining here because i still want the distinction between var let; and var let = undefined;
                        decl.value = varDeclStatement.value && this.evaluate(varDeclStatement.value);
                    }
                }else { //this will only happen for var
                    scope.set(varDeclStatement.name, new Variable({qualifier: varDeclStatement.qualifier, gender: varDeclStatement.gender, name: varDeclStatement.name}, varDeclStatement.value && this.evaluate(varDeclStatement.value)));
                }
            }

            /** @param {TemporalDeadZoneDeclarationStatement} temporalDeclStatement */
            visitTemporalDeclarationStatement(temporalDeclStatement) {
                const scope = this.state.variables.at(-1);
                scope.set(temporalDeclStatement.name, new TemporalDeadZoneVariable({qualifier: temporalDeclStatement.qualifier, gender: temporalDeclStatement.gender, name: temporalDeclStatement.name}, undefined));
            }
            
            //oops, he desugars the for loop but i won't because idk what if i wanted to transpile this to lua or something lol
            /** @param {ForLoopStatement} forLoopStatement */
            visitForLoopStatement(forLoopStatement) {
                //let's create a new scope here so that const or let variables will be vanished after we're done
                this.state.variables.push(new Map());
                for(const tdz of forLoopStatement.tdzStatements) {
                    tdz.accept(this); //should be fine
                }
                forLoopStatement.initialization.accept(this); //because we don't gaf about the return value we won't use evaluate
                let last;
                while(HostLanguage.isJavascriptTruthy(forLoopStatement.condition.accept(this))) {
                    last = this.evaluate(forLoopStatement.body);
                    forLoopStatement.afterthought.accept(this); //because we don't gaf about the return value we won't use evaluate
                }
                this.state.variables.pop();
                return last;
            }

            /** @param {ForOfStatement} forOfStatement */
            visitForOfStatement(forOfStatement) {
                //this could be any special javascript iterable thing...
                //we'll just check if it's one of those wrappers right here, otherwise do normal stuff so this thing can still do stuff until i write wrappers for all javascript objects or however that goes
                const scope = new Map();
                this.state.variables.push(scope);
                for(const tdz of forOfStatement.tdzStatements) {
                    tdz.accept(this); //should be fine
                }
                //hmm maybe i should've read the specification, how the hell does this part work?
                //with the ole reference record stuff this might be a lot simpler than before so we'll see lol
                let bindingRef;
                if(forOfStatement.identifierDeclaration instanceof VariableDeclarationStatement) {
                    //let, const
                    forOfStatement.identifierDeclaration.accept(this); // actually declare first lol
                    //bindingRef = this.visitIdentifierExpression({nameToken: {value: forOfStatement.identifierDeclaration.name}}); //bs engaged
                    //damn PutValue checks if that shit is const >:[
                }/*else if((forOfStatement.identifierDeclaration instanceof IdentifierExpression) || (forOfStatement.identifierDeclaration instanceof BinaryExpression)) {
                    //var declaration, other identifier
                    //property, if you really needed to do that
                    //const gv = this.getVariable(forOfStatement.identifierDeclaration);

                    }*/
                else {
                    //well shit with that reference shit this is so much easier
                    bindingRef = this.evaluate(forOfStatement.identifierDeclaration, false);
                }
                let last;
                const iterable = this.evaluate(forOfStatement.iterableExpr);
                if(iterable instanceof JavascriptObjectWrapper) {
                    //special
                }else {
                    //me being lazy primitive
                    for(const result of iterable) {
                        //we're doing bs
                        //SetValue(result); //some hypothetical function that handles allat bs
                        if(!bindingRef) {
                            //i mean sure bro
                            scope.get(forOfStatement.identifierDeclaration.name).value = result;
                        }else {
                            this.PutValue(bindingRef, result);
                        }
                        forOfStatement.body.accept(this);
                    }
                }
                this.state.variables.pop();
                return last;
            }

            ///** @param {ArrayComprehensionExpression} arrayComprehensionExpression */
            //visitArrayComprehensionExpression(arrayComprehensionExpression) {
            //    
            //}

            /** @param {FunctionStatement} functionStatement */
            visitFunctionStatement(functionStatement) {
                const scope = this.state.variables.at(-1);
                const closure = [];
                for(const map of this.state.variables) {
                    //const newMap = new Map();
                    //for(const [key, value] of map.entries()) {
                    //    newMap.set(key, value);
                    //}
                    closure.push(map); //we're creating a copy of the array so that push and pop don't affect our closure
                }
                // const wrapper = new FunctionWrapper(functionStatement, closure, undefined);
                //https://tc39.es/ecma262/#sec-runtime-semantics-instantiateordinaryfunctionobject
                const privateEnv = null;
                const wrapper = ECMAScript.OrdinaryFunctionCreate(this, ECMAScript["%Function.prototype%"], "insert source text here...", functionStatement.parameters, functionStatement.body, ThisMode.NON_LEXICAL_THIS, closure, privateEnv);
                //for some reason SetFunctionName is actually special
                //https://tc39.es/ecma262/#sec-setfunctionname
                //const success = wrapper["[[DefineOwnProperty]]"]("name", new JavascriptDataProperty(false, false, true, functionStatement.nameToken.value)); //simplified!
                //if(!success) {
                //    throw TypeError("Cannot redefine property: name");
                //}
                ECMAScript.SetFunctionName(wrapper, functionStatement.nameToken.value);
                //bruh i forgot the very next line
                ECMAScript.MakeConstructor(wrapper);
                
                if(scope.has(functionStatement.nameToken.value)) {
                    const old = scope.get(functionStatement.nameToken.value);
                    if(old instanceof TemporalDeadZoneVariable) {
                        //promote to regular var lol
                        const temp = new Variable(old.properties, wrapper);
                        scope.set(functionStatement.nameToken.value, temp);
                    }else { //for some reason you can redeclare functions with the same name

                        //my static analysis should handle all this?
                        //const oldGender = old.properties.gender?.value;
                        ////some kind of function object idk
                        //if(!(old.value instanceof FunctionWrapper)) {
                        //    throw new SyntaxError(`Identifier '${functionStatement.nameToken.value}' has already been declared${oldGender != functionStatement.genderToken?.value ? ` (with gender '${oldGender}')` : ""}`);
                        //}
                        old.value = wrapper;
                    }
                }else {
                    scope.set(functionStatement.nameToken.value, new Variable({qualifier: undefined, gender: functionStatement.genderToken, name: functionStatement.nameToken.value}, wrapper));
                    //closure.at(-1).set(functionStatement.nameToken.value, scope.get(functionStatement.nameToken.value)); //reference
                }
            }

            /** @param {ReturnStatement} returnStatement */
            visitReturnStatement(returnStatement) {
                throw this.evaluate(returnStatement.expr); //lol
            }
        }

        class Printer {
            tabs;
            constructor() {
                this.tabs = 0;
            }

            print(statement) {
                console.log(statement.accept(this));
            }

            /** @param {BlockStatement} blockStatement */
            visitBlockStatement(blockStatement) {
                let block = "{\n";
                this.tabs += 4;
                for(const statement of blockStatement.statements) {
                    block += "".padStart(this.tabs) + statement.accept(this) + "\n";
                }
                this.tabs -= 4;
                return block + "".padStart(this.tabs) + "}\n";
            }

            /** @param {IfStatement} ifStatement */
            visitIfStatement(ifStatement) {
                return `if ( ${ifStatement.condition.accept(this)} ) ${ifStatement.ifClause.accept(this)}${ifStatement.elseClause ? "else " + ifStatement.elseClause.accept(this) : ""}`;
            }

            /** @param {WhileStatement} whileStatement */
            visitWhileStatement(whileStatement) {
                return `while ( ${whileStatement.condition.accept(this)} ) ${whileStatement.body.accept(this)}`;
            }

            /** @param {ExpressionStatement} expressionStatement */
            visitExpressionStatement(expressionStatement) {
                return expressionStatement.expression.accept(this) + ";";
            }

            /** @param {IdentifierExpression} identifierExpression */
            visitIdentifierExpression(identifierExpression) {
                return identifierExpression.nameToken.value;
            }

            /** @param {UnaryExpression} unaryExpression */
            visitUnaryExpression(unaryExpression) {
                if(unaryExpression.postfix) {
                    return `(${unaryExpression.operand.accept(this)} ${unaryExpression.operatorToken.value})`;
                }else {
                    return `(${unaryExpression.operatorToken.value} ${unaryExpression.operand.accept(this)})`;
                }
            }
            
            /** @param {BinaryExpression} binaryExpression */
            visitBinaryExpression(binaryExpression) {
                return `(${binaryExpression.left.accept(this)} ${binaryExpression.operatorToken.value} ${binaryExpression.right.accept(this)}${binaryExpression.operatorToken.value == '[' ? " ]" : ""})`;
            }

            /** @param {TernaryExpression} ternaryExpression */
            visitTernaryExpression(ternaryExpression) {
                return `(${ternaryExpression.condition.accept(this)} ? ${ternaryExpression.trueExpr.accept(this)} : ${ternaryExpression.falseExpr.accept(this)})`;
            }

            /** @param {FunctionCallExpression} funcCallExpression */
            visitFunctionCallExpression(funcCallExpression) {
                return `${funcCallExpression.functionExpr.accept(this)}(${funcCallExpression.argumentsExprArr.map(v=>v.accept(this))})`;
            }

            /** @param {ArrayComprehensionExpression} arrayComprehensionExpression */
            visitArrayComprehensionExpression(arrayComprehensionExpression) {
                return `[${arrayComprehensionExpression.topMostStatementTree.accept(this)}]`; //that boy should unravel himself!
            }

            /** @param {LiteralExpression} literalExpression */
            visitLiteralExpression(literalExpression) {
                switch(typeof literalExpression.value) { //the dot has higher precedence
                    case "bigint":
                        return literalExpression.value+"n";
                        break;
                    case "string":
                        return `'${literalExpression.value}'`;
                        break;
                    case "object":
                        try {
                            return JSON.stringify(literalExpression.value); // apparently, passing window will cause JSON.stringify to throw an error! (of course, it would've been too much text if it worked anyways lol)
                            break;
                        }catch(e) {
                            console.warn(e);
                            //[[fallthrough]]
                        }
                    default:
                        return literalExpression.value+"";
                        break;
                }
            }

            visitEmptyStatement() {
                return ';';
            }

            /** @param {VariableDeclarationStatement} varDeclStatement */
            visitVariableDeclarationStatement(varDeclStatement) {
                let optionalshit = "";
                if(varDeclStatement.gender) {
                    optionalshit += varDeclStatement.gender.value + " ";
                }
                if(varDeclStatement.qualifier) {
                    optionalshit += varDeclStatement.qualifier.value + " ";
                }
                return optionalshit + varDeclStatement.name + (varDeclStatement.value != undefined ? " = " + varDeclStatement.value.accept(this) : "") + ";"; //don't worry lol ternary operator has lower precedence!
            }

            /** @param {TemporalDeadZoneDeclarationStatement} temporalDeclStatement */
            visitTemporalDeclarationStatement(temporalDeclStatement) {
                return `// (TDZ) ${temporalDeclStatement.qualifier.value} ${temporalDeclStatement.name};`; // <- temporal dead zone starts here
            }

            /** @param {ForOfStatement} statement */
            handleForStatementLazilyLol(statement, kind) {
                let result = `for${kind == "await" ? " "+kind : ""} (`;
                if(statement.tdzStatements.length) {
                    result += "\n";
                    for(const tdz of statement.tdzStatements) {
                        result += tdz.accept(this) + "\n";
                    }
                }
                switch(kind) {
                    case "loop":
                        result += statement.initialization.accept(this);
                        result += statement.condition.accept(this);
                        result += statement.afterthought.accept(this);
                        break;
                    case "await":
                    case "of":
                        result += statement.identifierDeclaration.accept(this);
                        result += " of ";
                        result += statement.iterableExpr.accept(this);
                        break;
                    case "in":
                        result += statement.identifierDeclaration.accept(this);
                        result += " in ";
                        result += statement.iterableExpr.accept(this);
                        break;
                }
                if(result[result.length-1] == ';') {
                    result = result.substring(0, result.length-1);
                }
                return result + ")" + statement.body.accept(this);
            }

            /** @param {ForLoopStatement} forLoopStatement */
            visitForLoopStatement(forLoopStatement) {
                return this.handleForStatementLazilyLol(forLoopStatement, "loop");
            }

            /** @param {ForOfStatement} forOfStatement */
            visitForOfStatement(forOfStatement) {
                return this.handleForStatementLazilyLol(forOfStatement, "of");
            }

            /** @param {ForInStatement} forInStatement */
            visitForInStatement(forInStatement) {
                return this.handleForStatementLazilyLol(forInStatement, "in");
            }

            /** @param {ForAwaitOfStatement} forAwaitOfStatement */
            visitForAwaitOfStatement(forAwaitOfStatement) {
                return this.handleForStatementLazilyLol(forAwaitOfStatement, "await");
            }

            parameters(parameters) {
                let result = "(";
                for(let i = 0; i < parameters.length; i++) {
                    const {identifier, default: $default} = parameters[i];
                    result += identifier.nameToken.value;
                    if($default) {
                        result += " = " + $default.accept(this);
                    }
                    if(i != parameters.length-1) {
                        result += ", ";
                    }
                }
                return result + ")";
            }

            /** @param {FunctionStatement} functionStatement */
            visitFunctionStatement(functionStatement) {
                return `${functionStatement.genderToken ? functionStatement.genderToken.value+" " : ""}${functionStatement.isAsync ? "async " : ""}function${functionStatement.isGenerator ? "*" : ""} ${functionStatement.nameToken.value} ${this.parameters(functionStatement.parameters)} ${functionStatement.body.accept(this)}`;
            }

            /** @param {ReturnStatement} returnStatement */
            visitReturnStatement(returnStatement) {
                return `return ${returnStatement.expr.accept(this)};`;
            }

            /** @param {DebuggerStatement} debuggerStatement */
            visitDebuggerStatement(debuggerStatement) {
                return `debugger;`;
            }
        }

        execute.addEventListener("click", function(event) {
            let interpreter = new JavascriptInterpreter();
            console.log("$0:", interpreter.interpret(letext.value));
        });
    </script>
