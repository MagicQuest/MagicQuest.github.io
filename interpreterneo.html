        //expressions can happen after semicolons, in parenthesis and at the beginning of lines
        //if a line starts with a reserved word we should switch based on the value
        
        //based on std::expected, but this could've also been rust's Result if i was in my rust era again
        /** @template [T=object, K=object] */
        class Expected {
            /** @type {T?} */
            value;
            /** @type {K?} */
            error;
            /**
             * @param {T?} value
             * @param {K?} error
             */
            constructor(value, error = undefined) {
                this.value = value;
                this.error = error;
            }
            has_value() {
                return this.value != undefined;
            }
        }

        function Unexpected(error) {
            return new Expected(undefined, error);
        }

        class ParseError {
            line;
            char;
            reason;
            constructor(line, char, reason) {
                this.line = line;
                this.char = char;
                this.reason = reason;
            }
            /** 
             * @param {String} source
             * @returns {String}
             */
            toString(source) {
                const lines = source.split("\n");
                let errorMessage = `Line: ${this.line}, Character: ${this.char}\n#### ${this.reason} ####\n${lines[this.line-1]}\n`;
                //for(let i = 0; i < this.char-1; i++) { // i feel like this loop is crazy but is there another way to do it (in javascript)
                //    errorMessage += " ";
                //}

                //oh yeah lol padStart i did it earlier
                errorMessage += "".padStart(this.char-1, " ");

                errorMessage += "^ HERE";
                // console.error(errorMessage);
                //throw errorMessage;
                return errorMessage;
            }
        }

        class Token {
            line;
            char;
            kind;
            value;
            constructor(line, char, kind, value) {
                this.line = line;
                this.char = char;
                this.kind = kind;
                this.value = value;
            }
        }

            static DOT = 13;
            //what else should become tokens... https://stackoverflow.com/questions/73226710/can-someone-explain-how-tokenizing-works-in-lexers
            static OPEN_PARENTHESIS = 14;
            static CLOSING_PARENTHESIS = 15;
            //operators
            static PLUS = 16;
            static MINUS = 17;
            static ASTERISK = 18;
            static SLASH = 19;
            static EXCLAMATION = 20;
            static DECREMENT = 21;
            static INCREMENT = 22;
            static OPTIONAL_CHAINING = 23;
            static BITWISE_NOT = 24;
            static EXPONENTIATION = 25;
            static REMAINDER = 26;
            static LESS_THAN = 27;
            static GREATER_THAN = 28;
            static LESS_EQUAL = 29;
            static GREATER_EQUAL = 30;

            static BITWISE_SHIFT_LEFT_EQUALS = 52;

            static BITWISE_UNSIGNED_SHIFT_RIGHT_EQUALS = 54;
            static BITWISE_AND_EQUALS = 55;

            static LOGICAL_AND_EQUALS = 59;

            static COMMA = 62;
            static SPREAD = 63;
            static SEMICOLON = 64;

            static ARROW = 67; //
        }

        class Interpreter {
            /** 
             * @param {String} str
             * @returns {Expected<Array, ParseError>}
             * */
            parse(str) {} // = 0;
            interpret(str) {
                const result = this.parse(str);
                if(!result.has_value()) {
                    const err = result.error.toString(str);
                    letext.style.backgroundColor = "pink";
                    //addConsoleText(true, [err]);
                    const temp = err.split("\n");
                    temp[temp.length-1] = "(this font isn't monospace so see the console for the correct character position)";
                    letext.setAttribute("title", temp.join("\n"));
                    throw err;
                }
                letext.style.backgroundColor = "";
                letext.removeAttribute("title");
                console.log(result.value);
                //etc...
            }
        }

        class Lexer {
            /** @type {Interpreter} */
            interpreter;
            /** @param {Interpreter} interpreter */
            constructor(interpreter) {
                this.interpreter = interpreter;
            }

            /**
             * @param {String} str
             * @returns {Expected<Array<Token>, ParseError>} */
            lex(str) {}; // = 0;
        }

        class Parser {
            /** @type {Interpreter} */
            interpreter;
            /** @type {Array<Token>} */
            tokens;
            /**
             * @param {Interpreter} interpreter
             * @param {Array<Token>} tokens */
            constructor(interpreter, tokens) {
                this.interpreter = interpreter;
                this.tokens = tokens;
            }

            /**
             * @returns {Expected<Array<Statement>, ParseError>} */
            parse() {}; // = 0;
        }

        class HostLanguage {
            //in javascript we do!
            static hasBigNumbers() {
                return true;
            }
            static isJavascriptTruthy(value) {
                return !!value;
            }
            static isJavascriptFalsy(value) {
                return !value;
            }
        }

        //lexical grammar for javascript
        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar
        //we're not doing that identifier unicode escape sequence shit lol (actually maybe it wouldn't be TOO hard)
        //my number production rule implies that 100e+2e+2 and 0755n are valid but we'll fix that in post
        //identifier ::= /[$_\p{ID_Start}][$\p{ID_Continue}]*/u
        //number ::= sign? ((hex | octal | binary) | ([0-9]* ('.' [0-9]*)?)) ('n' | ([eE] number))?
        //hex ::= '0' [xX] [0-9a-fA-F]+
        //octal ::= '0' [oO] [0-7]+
        //binary ::= '0' [bB] [0-1]+
        //sign ::= '+' | '-'
        //string ::= (["'`]).+\1
        //regex ::= '/' .+ '/' [gimsuy]*
        class JavascriptLexer extends Lexer {
            static reserved = new Map([
                //regular
                ["break", true],
                ["case", true],
                ["catch", true],
                ["class", true],
                ["const", true],
                ["continue", true],
                ["debugger", true],
                ["default", true],
                ["delete", true],
                ["do", true],
                ["else", true],
                ["export", true],
                ["extends", true],
                ["false", true],
                ["finally", true],
                ["for", true],
                ["function", true],
                ["if", true],
                ["import", true],
                ["in", true],
                ["instanceof", true],
                ["new", true],
                ["null", true],
                ["return", true],
                ["super", true],
                ["switch", true],
                ["this", true],
                ["throw", true],
                ["true", true],
                ["try", true],
                ["typeof", true],
                ["var", true],
                ["void", true],
                ["while", true],
                ["with", true],

                //strict mode
                // ["let", true],
                // ["static", true],
                // ["yield", true],

                //in modules or async functions (wait a second, doesn't that make javascript context... sensitive?!)
                ["await", true],

                //future reserved
                ["enum", true],

                //strict mode
                // ["implements", true],
                // ["interface", true],
                // ["package", true],
                // ["private", true],
                // ["protected", true],
                // ["public", true]
            ]);

            static strict_reserved = new Map([
                //regular
                ["let", true],
                ["static", true],
                ["yield", true],

                //future reserved
                ["implements", true],
                ["interface", true],
                ["package", true],
                ["private", true],
                ["protected", true],
                ["public", true]
            ]);

            i = 0;

            /** @param {JavascriptInterpreter} parentInterpreter */
            constructor(parentInterpreter) {
                super(parentInterpreter);
            }

            /** 
             * @param {String} str
             * @returns {Expected<Array<Token>, ParseError>} */
            lex(str, readingTemplate = false) {
                debugger;

                /** @type {Array<Token>} */
                const tokens = [];

                //let i = 0;
                let lineNumber = 1;
                let lineIndex = 0;

                let useStrict = false;

                let depth = {
                    parenthesis: 0,
                    bracket: 0,
                    curly: +readingTemplate
                };

                if(str.length > 1) {
                    if(str[0] == '#' && str[1] == '!') {
                        str = str.replace("#!", "//"); //lol
                    }
                }

                const isNumberRegex = /[0-9]/;
                const identifierStartRegex = /[$_\p{ID_Start}]/u;
                const identifierRegex = /[$\p{ID_Continue}]/u;

                const hexRegex = /[0-9a-f_]/i;
                const octalRegex = /[0-7_]/;

                templateStopLexing:
                while(this.i < str.length) {
                    const char = str[this.i++];
                    const charNumber = this.i - lineIndex;
                    switch(char) {
                        //https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Lexical_grammar#white_space
                        case '\t':
                        case '\v':
                        case '\f':
                        case ' ':
                        case '\r': //probably fine
                        case '\u00A0': //nbsp
                        case '\uFEFF': //bom marker
                        //<USP>...
                            continue;

                        case '/':
                            if(str[this.i] == '/') {
                                //comment
                                this.i = str.indexOf("\n", this.i);
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '*') {
                                //multiline comment
                                const target = str.indexOf("*/", this.i)+2;
                                while((this.i = str.indexOf("\n", this.i)+1) < target) { //uhh probably right
                                    lineNumber++;
                                    lineIndex = this.i;
                                }
                                this.i = target;
                                if(this.i == -1) this.i = str.length;
                            }else if(str[this.i] == '=') {
                                //consume =
                                this.i++;
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.DIV_EQUALS, "/="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.SLASH, "/"));
                            }
                            break;

                        case '\n': //automagic semicolon insertion...
                            lineNumber++;
                            lineIndex = this.i;
                            break;

                        case '"':
                        case '\'':
                        case '`': {
                            const stringToken = new Token(lineNumber, charNumber, TokenKind.STRING, "");
                            let escaped = false;
                            let ended = false;
                            while(this.i < str.length) {
                                if(str[this.i] == char) {
                                    this.i++; //consume ending quote
                                    ended = true;
                                    break;
                                }
                                if(str[this.i] == '\n') {
                                    lineNumber++;
                                    lineIndex = this.i;
                                    this.i++; //consume newline
                                    if(!escaped) {
                                        if(char == '`') {
                                            //backtick allows multiline string
                                            stringToken.value += "\n";
                                        }else {
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "Use a backslash for multiline strings! (or use the backtick quote '`')"));
                                        }
                                    }else {
                                        escaped = false;
                                    }
                                }else if(str[this.i] == '\\') {
                                    //escape!
                                    this.i++; //consume \
                                    switch(str[this.i]) {
                                        case '0':
                                            stringToken.value += '\0';
                                            break;
                                        case '1':
                                        case '2':
                                        case '3':
                                        case '4':
                                        case '5':
                                        case '6':
                                        case '7':
                                        case '8':
                                        case '9':
                                        case 'x':
                                        case 'u':
                                            return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "We're not doing all that fancy escape stuff bruh"));
                                            break;
                                        case '\'':
                                            stringToken.value += '\'';
                                            break;
                                        case '"':
                                            stringToken.value += '\"';
                                            break;
                                        case '\\':
                                            stringToken.value += '\\';
                                            break;
                                        case 'n':
                                            stringToken.value += '\n';
                                            break;
                                        case 'r':
                                            stringToken.value += '\r';
                                            break;
                                        case 'v':
                                            stringToken.value += '\v';
                                            break;
                                        case 't':
                                            stringToken.value += '\t';
                                            break;
                                        case 'b':
                                            stringToken.value += '\b';
                                            break;
                                        case 'f':
                                            stringToken.value += '\f';
                                            break;
                                        case '\r':
                                            if(str[this.i+1] == '\n') {
                                                //eval(`"\\\r\n"`);
                                                this.i++; //consume \r
                                                //[[fallthrough]]
                                            }else {
                                                stringToken.value += '\r';
                                                break;
                                            }
                                        case '\n':
                                            escaped = true;
                                            this.i--; //don't consume the newline!
                                            break;
                                        default:
                                            stringToken.value += str[this.i];
                                            break;
                                    }
                                    this.i++; //consume whatever character that was
                                }else if(char == '`' && str[this.i] == '$') {
                                    if(str[this.i+1] == '{') {
                                        const templateCharNumber = this.i - lineIndex;
                                        this.i+=2; //consume dollar and curly bracket
                                        //template
                                        const result = this.lex(str, true); // who knew making the lexer its own object would come in handy (i'm actually talking about using this.i)
                                        if(!result.has_value()) {
                                            return result;
                                        }
                                        tokens.push(new Token(lineNumber, templateCharNumber, TokenKind.TEMPLATE_EXPRESSION, result.value));
                                    }else {
                                        stringToken.value += str[this.i++];
                                    }
                                }else {
                                    stringToken.value += str[this.i++];
                                }
                            }
                            if(!ended) {
                                return Unexpected(new ParseError(lineNumber, this.i - lineIndex, "End of file reached before ending string quote!"));
                            }
                            if(tokens.length == 0 && stringToken.value == "use strict") { //lol
                                useStrict = true;
                            }
                            tokens.push(stringToken);
                            break;
                        }

                        case '?':
                            if(str[this.i] == '.') {
                                this.i++; //consume dot
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.OPTIONAL_CHAINING, "?."));
                            }else if(str[this.i] == '?') {
                                this.i++; //consume ?
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.NULLISH_COALESCING_EQUALS, "??="));
                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.NULLISH_COALESCING, "??"));
                                }
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.QUESTION, "?"));
                            }
                            break;

                        case ':':
                            tokens.push(new Token(lineNumber, charNumber, TokenKind.COLON, ":"));
                            break;

                        case ';':
                            tokens.push(new Token(lineNumber, charNumber, TokenKind.SEMICOLON, ";"));
                            break;

                        case '+':
                            if(str[this.i] == '+') {
                                this.i++; //consume +
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.INCREMENT, "++"));
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.PLUS_EQUALS, "+="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.PLUS, "+"));
                            }
                            break;

                        case '-':
                            if(str[this.i] == '-') {
                                this.i++; //consume -
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.DECREMENT, "--"));
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MINUS_EQUALS, "-="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MINUS, "-"));
                            }
                            break;

                        case '*':
                            if(str[this.i] == '*') {
                                this.i++; //consume *
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.EXPONENTIATION_EQUALS, "**="));
                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.EXPONENTIATION, "**"));
                                }
                            }else if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.MUL_EQUALS, "*="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.ASTERISK, "*"));
                            }
                            break;

                        case '%':
                            if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.REMAINDER_EQUALS, "%="));
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.REMAINDER, "%"));
                            }
                            break;

                        case '<':
                            if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.LESS_EQUAL, "<="));
                            }else if(str[this.i] == '<') {
                                this.i++; //consume <
                                if(str[this.i] == '=') {
                                    this.i++; //consume =
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_SHIFT_LEFT_EQUALS, "<<="));
                                }else {
                                    tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_SHIFT_LEFT, "<<"));
                                }
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.LESS_THAN, "<"));
                            }
                            break;

                        case '>':
                            if(str[this.i] == '=') {
                                this.i++; //consume =
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.GREATER_EQUAL, ">="));
                            }else if(str[this.i] == '>') {
                                this.i++; //consume >
                                if(str[this.i] == '>') {
                                    this.i++; //consume >
                                    if(str[this.i] == '=') {
                                        this.i++; //consume =
                                        tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT_EQUALS, ">>>="));
                                    }else {
                                        tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT, ">>>"));
                                    }
                                }else {
                                    if(str[this.i] == '=') {
                                        this.i++; //consume =
                                        tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_SHIFT_RIGHT_EQUALS, ">>="));
                                    }else {
                                        tokens.push(new Token(lineNumber, charNumber, TokenKind.BITWISE_SHIFT_RIGHT, ">>"));
                                    }
                                }
                            }else {
                                tokens.push(new Token(lineNumber, charNumber, TokenKind.GREATER_THAN, ">"));
                            }
                            break;

                        case '&':
                            if(str[this.i] == '&') {
                                this.i++; //consume &
                                if(str[this.i] == '=') {

        function isValidLeftHandAssignment(expression) {
            if(expression instanceof BinaryExpression) {
                let valid = isValidLeftHandAssignment(expression.left);
                if(!valid) {
                    return false;
                }
                switch(expression.operatorToken.kind) {
                    case TokenKind.DOT:
                    case TokenKind.OPEN_PARENTHESIS:
                    case TokenKind.OPEN_BRACKET:
                        return isValidLeftHandAssignment(expression.right);
                        break;
                    
                    default:
                        return false;
                        break;
                }
            }else if(expression instanceof FunctionCallExpression) {
                return isValidLeftHandAssignment(expression.functionExpr);
            }else if(expression instanceof IdentifierExpression) {
                return true;
            }

            //}

                    if(!this.match(TokenKind.COMMA) && !this.peek(TokenKind.CLOSING_PARENTHESIS)) {

                        }else {
                            throw new ParseError(this.tokens[this.i-1].line, this.tokens[this.i-1].char, "Expected comma in arguments!! (also the file shouldn't just end here lol)");

                    expr = new BinaryExpression(expr, this.tokens[this.i++], this.exponentiation());

                        case TokenKind.INCREMENT:
                            //return ++value; //uhh
                            break;
                    }
                }
            }

            /** @param {BlockStatement} blockStatement */
            visitBlockStatement(blockStatement) {
                this.state.variables.push(new Map());
                let last = undefined;
                for(const statement of blockStatement.statements) {
                    last = statement.accept(this);
                }
                this.state.variables.pop();
                return last;
            }

            /** @param {IfStatement} ifStatement */
            visitIfStatement(ifStatement) {
                if(HostLanguage.isJavascriptTruthy(ifStatement.condition.accept(this))) {
                    return ifStatement.ifClause.accept(this); //the devtools console will tell you the last thing evaluated in a statement so shall return the result too
                }else if(ifStatement.elseClause) {
                    return ifStatement.elseClause.accept(this);
                }
            }

            /** @param {WhileStatement} whileStatement */
            visitWhileStatement(whileStatement) {
                //while without while!
                //for(;HostLanguage.isJavascriptTruthy(whileStatement.condition.accept(this));) {
                let last = undefined;
                while(HostLanguage.isJavascriptTruthy(whileStatement.condition.accept(this))) {
                    last = whileStatement.body.accept(this);
                }
            }

            /** @param {ExpressionStatement} exprStatement */
            visitExpressionStatement(exprStatement) {
                return exprStatement.expression.accept(this);
            }

            /** @param {IdentifierExpression} identifierExpression */
            visitIdentifierExpression(identifierExpression) {
                //no scope yet lol
                //return globalThis[identifierExpression.nameToken.value];

                const name = identifierExpression.nameToken.value;

                //if(this.state.variables.has(name)) {
                //    return this.state.variables.get(name).value;
                //}else {
                //    if(!(name in globalThis)) {
                //        throw new ReferenceError(`${name} is not defined`);
                //    }
                //    return globalThis[name];
                //}

                //i wonder if i should check outer to inner or inner to outer
                for(let i = this.state.variables.length-1; i >= 0; i--) {
                    const scope = this.state.variables[i];
                    if(scope.has(name)) {
                        return scope.get(name).value;
                    }
                }

                if(!(name in globalThis)) {
                    throw new ReferenceError(`${name} is not defined`);
                }
                return globalThis[name];
            }

            /** @param {LiteralExpression} literalExpression */
            visitLiteralExpression(literalExpression) {
                return literalExpression.value; //right?
            }
            
            /** @param {BinaryExpression} binaryExpression */
            visitBinaryExpression(binaryExpression) {
                const kind = binaryExpression.operatorToken.kind;
                switch(kind) {
                    //assignment
                    //we need the location of the identifier instead of the value!
                    case TokenKind.NULLISH_COALESCING_EQUALS:
                    case TokenKind.LOGICAL_OR_EQUALS:
                    case TokenKind.LOGICAL_AND_EQUALS:
                    case TokenKind.BITWISE_OR_EQUALS:
                    case TokenKind.BITWISE_XOR_EQUALS:
                    case TokenKind.BITWISE_AND_EQUALS:
                    case TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT_EQUALS:
                    case TokenKind.BITWISE_SHIFT_RIGHT_EQUALS:
                    case TokenKind.BITWISE_SHIFT_LEFT_EQUALS:
                    case TokenKind.REMAINDER_EQUALS:
                    case TokenKind.DIV_EQUALS:
                    case TokenKind.MUL_EQUALS:
                    case TokenKind.EXPONENTIATION_EQUALS:
                    case TokenKind.MINUS_EQUALS:
                    case TokenKind.PLUS_EQUALS:
                    case TokenKind.EQUALS: {
                        //const name = binaryExpression.left.nameToken.value;
                        //if(this.state.variables.has(name)) {
                        //    const $var = this.state.variables.get(name);
                        //    if($var.properties.qualifier?.value == "") { //tuff optional chain
                        //
                        //    }
                        //}

                        //blehhhhhh
                        //i wonder how the guy solved this problem... (i'm not there yet lol! i'm only at the bottom of chapter 8!)
                        // (oh yeah the problem in question is getting the *location* of an expression like (console.log); ! )
                        //yeah alright i've already solved this one before lol let's go see what his solution is just in case mine sucks!

                        //identifiers that haven't been defined before are added to globalThis (strict mode disallows this, though!)
                        break;
                    }
                    
                    default:
                        break;
                }

                const left = binaryExpression.left.accept(this);
                //short circuiting operators
                if(kind == TokenKind.NULLISH_COALESCING) {
                    //or_nullish
                    if(left != null && left != undefined) {
                        return left;
                    }else {
                        return binaryExpression.right.accept(this);
                    }
                }else if(kind == TokenKind.LOGICAL_OR) {
                    //short circuit!
                    if(HostLanguage.isJavascriptTruthy(left)) {
                        return left;
                    }else {
                        return binaryExpression.right.accept(this);
                    }
                }else if(kind == TokenKind.LOGICAL_AND) {
                    //short circuit!
                    if(!HostLanguage.isJavascriptFalsy(left)) {
                        return left;
                    }else {
                        return binaryExpression.right.accept(this);
                    }
                }
                //access call, not short circuiting but we shouldn't evaluate the right identifier!
                else if(kind == TokenKind.OPTIONAL_CHAINING) {
                    //we SHOULD be able to assume that the right is an identifier because of JavascriptParser
                    let value = left?.[binaryExpression.right.nameToken.value];
                    if(value instanceof Function) {
                        value = value.bind(left); // for some reason i thought we wouldn't have to do this this time lol
                    }
                    return value;
                }else if(kind == TokenKind.DOT) {
                    let value = left[binaryExpression.right.nameToken.value];
                    if(value instanceof Function) {
                        value = value.bind(left); // for some reason i thought we wouldn't have to do this this time lol
                    }
                    return value; //lol!
                }
                //we can safely evaluate the right :)
                const right = binaryExpression.right.accept(this);
                switch(kind) {
                    //comma
                    case TokenKind.COMMA: {
                        //left;
                        return right;
                        break;
                    }
                    
                    //bitwise_or
                    case TokenKind.BITWISE_OR:
                        return left | right;
                        break;
                    
                    //bitwise_x0r
                    case TokenKind.BITWISE_XOR:
                        return left ^ right;
                        break;
                    
                    //bitwise_and
                    case TokenKind.BITWISE_AND:
                        return left & right;
                        break;
                    
                    //equality
                    case TokenKind.STRICT_NOT_EQUAL:
                        return left !== right;
                        break;
                    case TokenKind.STRICT_EQUAL:
                        return left === right;
                        break;
                    case TokenKind.NOT_EQUAL:
                        return left != right;
                        break;
                    case TokenKind.EQUAL_EQUAL:
                        return left == right;
                        break;
                    
                    //comparison
                    case TokenKind.LESS_THAN:
                        return left < right;
                        break;
                    case TokenKind.LESS_EQUAL:
                        return left <= right;
                        break;
                    case TokenKind.GREATER_THAN:
                        return left > right;
                        break;
                    case TokenKind.GREATER_EQUAL:
                        return left >= right;
                        break;
                    case TokenKind.RESERVED:
                        if(binaryExpression.operatorToken.value == "in") {
                            return left in right;
                        }else if(binaryExpression.operatorToken.value == "instanceof") {
                            return left instanceof right;
                        }
                        break;

                    //bitwise_shift
                    case TokenKind.BITWISE_SHIFT_LEFT:
                        return left << right;
                        break;
                    case TokenKind.BITWISE_SHIFT_RIGHT:
                        return left >> right;
                        break;
                    case TokenKind.BITWISE_UNSIGNED_SHIFT_RIGHT:
                        return left >>> right;
                        break;
                    
                    //term
                    case TokenKind.PLUS:
                        return left + right; //string concatenation uses a different operator in lua so i'd have to check the types!
                        break;
                    case TokenKind.MINUS:
                        return left - right; //i don't think there's a single math operator that will throw in javascript (which seems crazy but even something like 2 ** [] still works!) so i'd have to do some extra stuff in lua here too.
                        break;

                    //factor
                    case TokenKind.REMAINDER:
                        return left % right;
                        break;
                    case TokenKind.SLASH:
                        return left / right;
                        break;
                    case TokenKind.ASTERISK:
                        return left * right;
                        break;
                    
                    //exponentiation
                    case TokenKind.EXPONENTIATION:
                        return left ** right;
                        break;

                    //access_call
                    case TokenKind.OPEN_BRACKET:
                        let value = left[right];
                        if(value instanceof Function) {
                            value = value.bind(left);
                        }
                        return value;
                        break;
                }
            }

            /** @param {TernaryExpression} ternaryExpression */
            visitTernaryExpression(ternaryExpression) {
                //if(Environment.isTruthy(ternaryExpression.condition)) {
                //    return ternaryExpression.trueExpr.accept(this);
                //}else {
                //    return ternaryExpression.falseExpr.accept(this);
                //}
                return HostLanguage.isJavascriptTruthy(ternaryExpression.condition.accept(this)) ? ternaryExpression.trueExpr.accept(this) : ternaryExpression.falseExpr.accept(this);
            }

            /** @param {FunctionCallExpression} funcCallExpression */
            visitFunctionCallExpression(funcCallExpression) {
                const func = funcCallExpression.functionExpr.accept(this);
                return func(...funcCallExpression.argumentsExprArr.map(v=>v.accept(this)));
            }

            visitEmptyStatement() {};

            /** @param {VariableDeclarationStatement} varDeclStatement */
            visitVariableDeclarationStatement(varDeclStatement) {
                //let z, w = (z = 6, 7); //to answer your curiosity, the expression is only evaluated once! let i = 0; let z, w = (i++, z=2, 3);
                //"initializing" 2 vars with let!
                //wait what the fuck?! when i wrote this i thought you couldn't do 2 vars at once!!
                //apparently i could've done let z = 6, w = 7; and it would've worked
                const scope = this.state.variables.at(-1);
                if(scope.has(varDeclStatement.name)) {
                    /** @type {Variable} */
                    const decl = scope.get(varDeclStatement.name);
                    const oldQualifier = decl.properties.qualifier.value;
                    const oldGender = decl.properties.gender?.value;
                    if(varDeclStatement.qualifier.value == "const" || varDeclStatement.qualifier.value == "let" || oldQualifier != varDeclStatement.qualifier.value || oldGender != varDeclStatement.gender?.value) {
                        throw new SyntaxError(`Identifier '${varDeclStatement.name}' has already been declared${oldGender != varDeclStatement.gender?.value ? ` (with gender '${oldGender}')` : ""}`);
                    }
                    if(varDeclStatement.value == undefined && varDeclStatement.qualifier.value == "var") {
                        return;
                    }
                    decl.value = varDeclStatement.value.accept(this);
                }else {
                    scope.set(varDeclStatement.name, new Variable({qualifier: varDeclStatement.qualifier, gender: varDeclStatement.gender}, varDeclStatement.value && varDeclStatement.value.accept(this)));
                }
            }
        }

        class Printer {
            tabs;
            constructor() {
                this.tabs = 0;
            }

            print(statement) {
                console.log(statement.accept(this));
            }

            /** @param {BlockStatement} blockStatement */
            visitBlockStatement(blockStatement) {
                let block = "{\n";
                this.tabs += 4;
                for(const statement of blockStatement.statements) {
                    block += "".padStart(this.tabs) + statement.accept(this) + "\n";
                }
                return block + "}\n";
            }

            /** @param {IfStatement} ifStatement */
            visitIfStatement(ifStatement) {
                return `if ( ${ifStatement.condition.accept(this)} ) ${ifStatement.ifClause.accept(this)}${ifStatement.elseClause ? "else " + ifStatement.elseClause.accept(this) : ""}`;
            }

            /** @param {WhileStatement} whileStatement */
            visitWhileStatement(whileStatement) {
                return `while ( ${whileStatement.condition.accept(this)} ) ${whileStatement.body.accept(this)}`;
            }

            /** @param {ExpressionStatement} expressionStatement */
            visitExpressionStatement(expressionStatement) {
                return expressionStatement.expression.accept(this) + ";";
            }

            /** @param {IdentifierExpression} identifierExpression */
            visitIdentifierExpression(identifierExpression) {
                return identifierExpression.nameToken.value;
            }

            /** @param {UnaryExpression} unaryExpression */
            visitUnaryExpression(unaryExpression) {
                if(unaryExpression.postfix) {
                    return `(${unaryExpression.operand.accept(this)} ${unaryExpression.operatorToken.value})`;
                }else {
                    return `(${unaryExpression.operatorToken.value} ${unaryExpression.operand.accept(this)})`;
                }
            }
            
            /** @param {BinaryExpression} binaryExpression */
            visitBinaryExpression(binaryExpression) {
                return `(${binaryExpression.left.accept(this)} ${binaryExpression.operatorToken.value} ${binaryExpression.right.accept(this)}${binaryExpression.operatorToken.value == '[' ? " ]" : ""})`;
            }

            /** @param {TernaryExpression} ternaryExpression */
            visitTernaryExpression(ternaryExpression) {
                return `(${ternaryExpression.condition.accept(this)} ? ${ternaryExpression.trueExpr.accept(this)} : ${ternaryExpression.falseExpr.accept(this)})`;
            }

            /** @param {FunctionCallExpression} funcCallExpression */
            visitFunctionCallExpression(funcCallExpression) {
                return `${funcCallExpression.functionExpr.accept(this)}(${funcCallExpression.argumentsExprArr.map(v=>v.accept(this))})`;
            }

            /** @param {LiteralExpression} literalExpression */
            visitLiteralExpression(literalExpression) {
                switch(typeof literalExpression.value) { //the dot has higher precedence
                    case "bigint":
                        return literalExpression.value+"n";
                        break;
                    case "string":
                        return `'${literalExpression.value}'`;
                        break;
                    case "object":
                        try {
                            return JSON.stringify(literalExpression.value); // apparently, passing window will cause JSON.stringify to throw an error! (of course, it would've been too much text if it worked anyways lol)
                            break;
                        }catch(e) {
                            console.warn(e);
                            //[[fallthrough]]
                        }
                    default:
                        return literalExpression.value+"";
                        break;
                }
            }

            visitEmptyStatement() {
                return ';';
            }

            /** @param {VariableDeclarationStatement} varDeclStatement */
            visitVariableDeclarationStatement(varDeclStatement) {
                let optionalshit = "";
                if(varDeclStatement.gender) {
                    optionalshit += varDeclStatement.gender.value + " ";
                }
                if(varDeclStatement.qualifier) {
                    optionalshit += varDeclStatement.qualifier.value + " ";
                }
                return optionalshit + varDeclStatement.name + (varDeclStatement.value != undefined ? " = " + varDeclStatement.value.accept(this) : "") + ";"; //don't worry lol ternary operator has lower precedence!
            }

            handleForStatementLazilyLol(statement, kind) {
                let result = `for${kind == "await" ? " "+kind : ""} (`;
                switch(kind) {
                    case "loop":
                        result += statement.initialization.accept(this);
                        result += statement.condition.accept(this);
                        result += statement.afterthought.accept(this);
                        break;
                    case "await":
                    case "of":
                        result += statement.identifierDeclaration.accept(this);
                        result += " of ";
                        result += statement.iterableExpr.accept(this);
                        break;
                    case "in":
                        result += statement.identifierDeclaration.accept(this);
                        result += " in ";
                        result += statement.iterableExpr.accept(this);
                        break;
                }
                if(result[result.length-1] == ';') {
                    result = result.substring(0, result.length-1);
                }
                return result + ")" + statement.body.accept(this);
            }

            /** @param {ForLoopStatement} forLoopStatement */
            visitForLoopStatement(forLoopStatement) {
                return this.handleForStatementLazilyLol(forLoopStatement, "loop");
            }

            /** @param {ForOfStatement} forOfStatement */
            visitForOfStatement(forOfStatement) {
                return this.handleForStatementLazilyLol(forOfStatement, "of");
            }

            /** @param {ForInStatement} forInStatement */
            visitForInStatement(forInStatement) {
                return this.handleForStatementLazilyLol(forInStatement, "in");
            }

            /** @param {ForAwaitOfStatement} forAwaitOfStatement */
            visitForAwaitOfStatement(forAwaitOfStatement) {
                return this.handleForStatementLazilyLol(forAwaitOfStatement, "await");
            }
        }

        execute.addEventListener("click", function(event) {
            let interpreter = new JavascriptInterpreter();
            console.log("$0:", interpreter.interpret(letext.value));
        });
    </script>
